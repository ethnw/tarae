# tarae-trace — eBPF measurements of tarae on Linux, for its developers (`cargo xtask trace`, which builds and
# runs it in a container). Never part of tarae: outside its workspace, and the BPF dependencies are Linux-only,
# so on a Mac this crate builds as a stub and never touches libbpf.
[package]
name = "tarae-trace"
version = "0.0.0"
edition = "2024"
publish = false
license = "GPL-3.0-or-later"

[dependencies]
serde_json = "1"
# .eh_frame for unwinding user stacks (`unwind.rs`) — the version blazesym already brings, no feature more
gimli = { version = "0.33", default-features = false, features = ["read"] }

[target.'cfg(target_os = "linux")'.dependencies]
libbpf-rs = "0.27.2"
blazesym = "0.2.6"
libc = "0.2"  # Ctrl-C ends a trace (and writes it) instead of killing it

# Not part of tarae's workspace
[workspace]
