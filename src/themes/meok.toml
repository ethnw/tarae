# 먹 (meok) — tarae's default dark theme. Ink background + a single thread-coral accent.
# Principle: use only one accent color, boldly. The code's hues are ayu's family (orange keywords, blue types, green
# strings, yellow functions, magenta constants) fitted to the ink — alive, never neon; dimmed things come in only
# three steps (dim·faint·surface). Every text clears its floor (body 4.5:1, comment 4, dim 3, faint 2).
# Format: see the header of theme.rs.

"ui.background" = { bg = "ink" }
"ui.text" = "paper"
"ui.text.focus" = { fg = "paper_hi", bold = true }
"ui.text.directory" = "blue"
"ui.accent" = "coral"
"ui.selection" = { bg = "sel" }
"ui.selection.primary" = { bg = "sel_hi" }
"ui.cursor" = { fg = "ink", bg = "coral_dim" }
"ui.cursor.primary" = { fg = "ink", bg = "coral" }
"ui.cursor.primary.insert" = { fg = "ink", bg = "green" }
"ui.cursor.primary.select" = { fg = "ink", bg = "magenta" }
"ui.cursor.match" = { bg = "surface_hi", bold = true }
"ui.cursorline.primary" = { bg = "line" }
"ui.linenr" = "faint"
"ui.linenr.selected" = { fg = "coral", bold = true }
"ui.statusline" = { fg = "paper", bg = "ink" }
"ui.statusline.inactive" = { fg = "dim", bg = "ink" }
"ui.statusline.normal" = { fg = "ink", bg = "coral", bold = true }
"ui.statusline.insert" = { fg = "ink", bg = "green", bold = true }
"ui.statusline.select" = { fg = "ink", bg = "magenta", bold = true }
"ui.bufferline" = { fg = "dim", bg = "ink" }
"ui.bufferline.active" = { fg = "paper_hi", bg = "ink", bold = true }
"ui.virtual" = "dim"
"ui.virtual.whitespace" = "faint"
"ui.virtual.inlay-hint" = { fg = "dim", italic = true }
"ui.virtual.ruler" = { bg = "line" }
"ui.virtual.indent-guide" = "guide"
"ui.popup" = { fg = "paper", bg = "surface" }
"ui.popup.info" = { fg = "paper", bg = "surface" }
"ui.menu" = { fg = "paper", bg = "surface" }
"ui.menu.selected" = { fg = "paper_hi", bg = "surface_hi" }
"ui.help" = { fg = "paper", bg = "surface" }
"ui.window" = "faint"

"error" = "red"
"warning" = "amber"
"info" = "blue"
"hint" = "dim"
"diagnostic.error" = { underline = { color = "red", style = "curl" } }
"diagnostic.warning" = { underline = { color = "amber", style = "curl" } }
"diagnostic.info" = { underline = { color = "blue", style = "curl" } }
"diagnostic.hint" = { underline = { color = "dim", style = "curl" } }
"diagnostic.unnecessary" = { dim = true }
"diagnostic.deprecated" = { crossed = true }
"diff.plus" = "green"
"diff.minus" = "red"
"diff.delta" = "amber"

"comment" = "comment"
"keyword" = "orange"
"keyword.control" = "orange"
"keyword.operator" = "orange"
"keyword.directive" = "teal"
"function" = "yellow"
"function.builtin" = "yellow"
"function.macro" = "teal"
"function.special" = "teal"
"type" = "blue"
"type.builtin" = "blue"
"type.enum.variant" = "magenta"
"constructor" = "blue"
"constant" = "magenta"
"constant.builtin" = "magenta"
"constant.numeric" = "magenta"
"constant.character" = "green"
"constant.character.escape" = "teal"
"string" = "green"
"string.regexp" = "teal"
"string.special" = "teal"
"variable" = "paper"
"variable.builtin" = { fg = "orange", italic = true }
"variable.parameter" = { fg = "paper", italic = true }
"variable.other.member" = "paper"
"attribute" = "sand"
"namespace" = "paper"
"label" = "teal"
"tag" = "blue"
"operator" = "punct"
"punctuation" = "punct"
"special" = "coral"

"markup.heading" = { fg = "coral", bold = true }
"markup.bold" = { bold = true }
"markup.italic" = { italic = true }
"markup.strikethrough" = { crossed = true }
"markup.link.url" = { fg = "blue", underline = true }
"markup.link.text" = "blue"
"markup.raw" = "sand"
"markup.list" = "coral"
"markup.quote" = { fg = "dim", italic = true }

[palette]
ink = "#0c0e12"
line = "#13161b"
surface = "#1a1d24"
surface_hi = "#262a34"
sel = "#232a38"
sel_hi = "#2d3548"
faint = "#545862"
guide = "#21242b"
dim = "#747884"
comment = "#7d786e"
punct = "#8d909a"
paper = "#d6d2c8"
paper_hi = "#f1ede4"
coral = "#f4805a"
coral_dim = "#9a5a44"
orange = "#f19e53"
yellow = "#e6bd66"
blue = "#72bdea"
magenta = "#cda8f5"
green = "#abd06a"
teal = "#86cfc0"
sand = "#e2c27f"
red = "#f0727e"
amber = "#ffb52e"
