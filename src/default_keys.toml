[select]
h = "extend_char_left"
j = "extend_visual_line_down"
k = "extend_visual_line_up"
l = "extend_char_right"
left = "extend_char_left"
down = "extend_visual_line_down"
up = "extend_visual_line_up"
right = "extend_char_right"
w = "extend_next_word_start"
b = "extend_prev_word_start"
e = "extend_next_word_end"
v = "normal_mode"
esc = "normal_mode"

# View mode — a cursor on what a surface shows (the chat's conversation): normal mode's moves, selections,
# search and counts (kept to `view::COMMANDS`; your [keys.normal] spill in), these on top, then [view.<surface>]
[view]
up = "scroll_up"
down = "scroll_down"
left = "page_up"
right = "page_down"
G = "view_latest"
y = "view_copy"
# (a selection: quoted to the chat — nothing selected: back to typing)
ret = "view_take"
i = "view_input"
a = "view_input"
esc = "view_leave"
# (as tmux's copy mode and less: `q` out too)
q = "view_leave"

# `space` in view mode: what it has of the editor's menu there — the rest acts on the code, out of sight
[view.space]
">" = "quote"
l = "chat_open"
I = "inbox"
"?" = "command_palette"

# The terminal: its view mode's own on top of [view] — `C-\` (the round: code → program → view → code, a selection
# or not), the
# slot's other tabs, `q` hides the panel (the shell runs on) as every output panel's `q` closes it
[view.terminal]
"C-\\" = "view_code"
tab = "slot_next"
S-tab = "slot_prev"
q = "wclose"

# The run panels — the task's output, a preflight's, the tests' detail: their view mode's own on top of [view] —
# the slot's other tabs, where Claude's command ran, a preflight step's whole output, `q` closes the panel once its
# run has ended (`enter` with nothing selected runs your run waiting behind, else goes to the chat's input)
[view.run]
tab = "slot_next"
S-tab = "slot_prev"
# (a row, as on every output panel — the chat's view keeps its `C-y`, its last code block)
C-e = "scroll_down"
C-y = "scroll_up"
K = "run_where"
o = "preflight_output"
q = "wclose"

# The chat's input: what its keys run before they're typed
[chat]
esc = "chat_view"

# The keys taken from the terminal's program — everything else is its (vim needs `esc`). Yours merge over these;
# bind one to `to_program` to give it back to the program.
[terminal]
"C-\\" = "terminal_view"

[insert]
esc = "normal_mode"
ret = "insert_newline"
C-j = "insert_newline"
tab = "insert_tab"
C-x = "completion"
C-s = "commit_undo_checkpoint"
C-r = "insert_register"
backspace = "delete_char_backward"
C-h = "delete_char_backward"
del = "delete_char_forward"
C-d = "delete_char_forward"
C-w = "delete_word_backward"
A-backspace = "delete_word_backward"
A-d = "delete_word_forward"
A-del = "delete_word_forward"
C-u = "kill_to_line_start"
C-k = "kill_to_line_end"
home = "goto_line_start"
end = "goto_line_end_newline"
pageup = "page_up"
pagedown = "page_down"
left = "move_char_left"
down = "move_visual_line_down"
up = "move_visual_line_up"
right = "move_char_right"
