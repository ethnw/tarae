# tarae default keymap — a subset of helix's default keymap, same syntax, same command names.
# User config ~/.config/tarae/config.toml's [keys.normal|select|insert] is merged on top of this.
# [select] inherits [normal] and overrides only what is listed here.

[normal]
"C-\\" = "terminal_focus"
# Debugger (IDE convention): F5 start/continue · F9 breakpoint · F10 step over · F11 step in · F12 step out
F5 = "dap_launch"
F9 = "toggle_breakpoint"
F10 = "dap_next"
F11 = "dap_step_in"
F12 = "dap_step_out"
h = "move_char_left"
j = "move_visual_line_down"
k = "move_visual_line_up"
l = "move_char_right"
left = "move_char_left"
down = "move_visual_line_down"
up = "move_visual_line_up"
right = "move_char_right"
w = "move_next_word_start"
b = "move_prev_word_start"
e = "move_next_word_end"
G = "goto_line"
home = "goto_line_start"
end = "goto_line_end"
C-f = "page_down"
C-b = "page_up"
C-d = "half_page_down"
C-u = "half_page_up"
pagedown = "page_down"
pageup = "page_up"
"A-." = "repeat_last_motion"
C-o = "jump_backward"
C-i = "jump_forward"
tab = "jump_forward"
C-s = "save_selection"
"." = "repeat_last_insert"
A-o = "expand_selection"
A-up = "expand_selection"
A-i = "shrink_selection"
A-down = "shrink_selection"
A-n = "select_next_sibling"
A-right = "select_next_sibling"
A-p = "select_prev_sibling"
A-left = "select_prev_sibling"
C-c = "toggle_comments"
"|" = "shell_pipe"
"A-|" = "shell_pipe_to"
"!" = "shell_insert_output"
"A-!" = "shell_append_output"
"$" = "shell_keep_pipe"

v = "select_mode"
":" = "command_mode"
esc = "normal_mode"

i = "insert_mode"
a = "append_mode"
I = "insert_at_line_start"
A = "insert_at_line_end"
o = "open_below"
O = "open_above"

d = "delete_selection"
"A-d" = "delete_selection_noyank"
c = "change_selection"
"A-c" = "change_selection_noyank"
y = "yank"
p = "paste_after"
P = "paste_before"
u = "undo"
U = "redo"

x = "extend_line_below"
# Select lines upward one at a time (mirror of x) — one more line per press
X = ["extend_line_up", "extend_to_line_bounds"]
A-x = "extend_to_line_bounds"
";" = "collapse_selection"
"A-;" = "flip_selections"
"," = "keep_primary_selection"
"%" = "select_all"
C = "copy_selection_on_next_line"
"A-C" = "copy_selection_on_prev_line"

f = "find_next_char"
t = "find_till_char"
F = "find_prev_char"
T = "till_prev_char"
r = "replace"
"~" = "switch_case"
"`" = "switch_to_lowercase"
"A-`" = "switch_to_uppercase"
">" = "indent"
"<" = "unindent"
J = "join_selections"
'"' = "select_register"
Q = "record_macro"
q = "replay_macro"

"/" = "search"
"?" = "rsearch"
n = "search_next"
N = "search_prev"
"*" = "search_selection"
s = "select_regex"
S = "split_selection"
"A-s" = "split_selection_on_newline"
K = "keep_selections"
"A-K" = "remove_selections"

[normal."]"]
d = "goto_next_diag"
x = "goto_next_test_failure"
f = "goto_next_function"
t = "goto_next_class"
a = "goto_next_parameter"
c = "goto_next_comment"
T = "goto_next_test"
p = "goto_next_paragraph"
space = "add_newline_below"
g = "goto_next_change"
G = "goto_next_change_part"
F = "goto_next_review_file"
# A review's next file not viewed yet (changed since viewed too)
u = "goto_next_unviewed_file"
# A review's high-risk changes no one has looked at yet (space v h looks), across its files
h = "goto_next_high_change"
n = "goto_next_note"
q = "goto_next_quickfix"
m = "goto_next_conflict"
# Claude's turns, stop by stop (what it read, edited, found) — past the newest, follow goes on
r = "replay_next"

[normal."["]
d = "goto_prev_diag"
x = "goto_prev_test_failure"
f = "goto_prev_function"
t = "goto_prev_class"
a = "goto_prev_parameter"
c = "goto_prev_comment"
T = "goto_prev_test"
p = "goto_prev_paragraph"
space = "add_newline_above"
g = "goto_prev_change"
G = "goto_prev_change_part"
F = "goto_prev_review_file"
u = "goto_prev_unviewed_file"
h = "goto_prev_high_change"
n = "goto_prev_note"
q = "goto_prev_quickfix"
m = "goto_prev_conflict"
r = "replay_prev"

[normal.space.G]
a = "dap_attach"
b = "toggle_breakpoint"
l = "dap_launch"
c = "dap_launch"
n = "dap_next"
i = "dap_step_in"
o = "dap_step_out"
p = "dap_pause"
t = "dap_terminate"
C-c = "dap_edit_condition"
C-l = "dap_edit_log"
w = "dap_watch"
W = "dap_unwatch"

# Tests (x = run): test at cursor · debug · whole file · rerun last · close window
# Build tasks (m = run again · p = pick · c = stop/close · s = what the sandbox blocked in Claude's command)
[normal.space.m]
m = "task_again"
p = "task_picker"
c = "task_close"
s = "task_sandbox"

[normal.space.v]
v = "review_start"
b = "review_branch"
m = "review_viewed"
M = "review_unviewed"
h = "review_hunk_seen"
H = "review_file_seen"
s = "review_send"
c = "review_claude"
C = "review_board"
r = "review_verdict"
q = "review_close"
a = "review_at_end"
t = "review_turn"
u = "review_undo_change"
z = "review_wide"

[normal.space.x]
x = "test_nearest"
d = "test_debug"
f = "test_file"
l = "test_last"
o = "test_output"
c = "test_close"
s = "test_sandbox"

[normal."C-w"]
v = "vsplit"
s = "hsplit"
w = "rotate_view"
C-w = "rotate_view"
h = "jump_view_left"
l = "jump_view_right"
k = "jump_view_up"
j = "jump_view_down"
e = "focus_side_panel"
q = "wclose"
o = "wonly"
gt = "panel_wider"
lt = "panel_narrower"
"+" = "bottom_taller"
minus = "bottom_shorter"
"=" = "sizes_auto"
z = "zoom_toggle"
t = "slot_next"

[normal.space.w]
v = "vsplit"
s = "hsplit"
w = "rotate_view"
C-w = "rotate_view"
h = "jump_view_left"
l = "jump_view_right"
k = "jump_view_up"
j = "jump_view_down"
e = "focus_side_panel"
q = "wclose"
o = "wonly"
gt = "panel_wider"
lt = "panel_narrower"
"+" = "bottom_taller"
minus = "bottom_shorter"
"=" = "sizes_auto"
z = "zoom_toggle"
t = "slot_next"

[normal.space]
e = "file_explorer"
g = "git_panel"
o = "outline"
q = "quickfix_panel"
T = "terminal"
a = "code_action"
r = "rename_symbol"
i = "llm_ask"
l = "chat_open"
L = "chat_close"
# Point at something on screen (a card, a row, a run) — it goes with your next chat message (C-o in the chat)
"@" = "chat_point"
# Quote the selection to the chat (it goes with your next message) — nothing selected: the chat's conversation
# under a cursor, to read, search, copy and quote (esc from the chat's input too)
">" = "quote"
n = "note_here"
N = "note_picker"
u = "undo_turn"
U = "redo_turn"
# Sessions: a branch in a checkout of its own — the list (in it: n new · d end · b bring in · $ billing · 1–9 switch)
W = "session_list"
# What waits for your answer, every session's, oldest first (C-q goes to the first)
I = "inbox"
# Comments, as in Helix: line comments over the selections' lines · a block comment around each selection
c = "toggle_comments"
C = "toggle_block_comments"
"?" = "command_palette"
t = "theme_picker"
s = "symbol_picker"
S = "workspace_symbol_picker"
k = "hover"
d = "diagnostics_picker"
D = "workspace_diagnostics_picker"
h = "select_references_to_symbol_under_cursor"
f = "file_picker"
b = "buffer_picker"
"/" = "global_search"
j = "jumplist_picker"
"'" = "last_picker"
y = "yank_to_clipboard"
p = "paste_clipboard_after"
P = "paste_clipboard_before"

[normal.m]
m = "match_brackets"
i = "select_textobject_inner"
a = "select_textobject_around"
s = "surround_add"
r = "surround_replace"
d = "surround_delete"

# View: `z` once, `Z` stays until Esc
[normal.z]
z = "align_view_center"
c = "align_view_center"
t = "align_view_top"
b = "align_view_bottom"
w = "toggle_soft_wrap"
j = "scroll_down"
k = "scroll_up"
C-f = "page_down"
C-b = "page_up"
C-d = "half_page_down"
C-u = "half_page_up"

[normal.Z]
z = "align_view_center"
c = "align_view_center"
t = "align_view_top"
b = "align_view_bottom"
w = "toggle_soft_wrap"
j = "scroll_down"
k = "scroll_up"
C-f = "page_down"
C-b = "page_up"
C-d = "half_page_down"
C-u = "half_page_up"

[normal.g]
w = "goto_word"
t = "goto_window_top"
c = "goto_window_center"
b = "goto_window_bottom"
d = "goto_definition"
D = "goto_declaration"
y = "goto_type_definition"
i = "goto_implementation"
r = "goto_reference"
a = "goto_last_accessed_file"
g = "goto_file_start"
e = "goto_last_line"
h = "goto_line_start"
l = "goto_line_end"
