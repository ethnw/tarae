# Rust: rust-analyzer; `cargo test` in the package, filtered by module path; lldb-dap on the test binary to
# debug.

# What runs later outside Claude's sandbox, in every project (`packs::protect`): a crate's build script, its
# manifest (dependencies, build settings), cargo's config (build and target dirs, `[env]`, runners — #20)
protect = ["build.rs", "Cargo.toml", ".cargo"]
# cargo's builds
outputs = ["target"]
# What checks and builds: the places Claude's run of one prints go to your list (]q)
checks = ["cargo build", "cargo check", "cargo test", "cargo clippy", "cargo nextest", "cargo fmt", "cargo perf"]
# cargo colours its output even into a pipe when its config says `always`: tasks and tests read it plain
color-off = { CARGO_TERM_COLOR = "never" }
# What a first build makes beside those names: cargo's builds, and the lock file it writes in place (an empty
# one it takes)
first-made = ["target/", "Cargo.lock"]
# Read by cargo, rustup and their tools as soon as they're on disk: a half-edited one breaks every cargo run
# (#19 — `~/.cargo/config.toml`), so a save that doesn't parse stays in the buffer
config-files = { toml = [
    "Cargo.toml", "rust-toolchain.toml", "rustfmt.toml", ".rustfmt.toml", "clippy.toml", ".clippy.toml",
    "deny.toml", ".cargo/config.toml", ".cargo/config", ".cargo/credentials.toml",
] }

# rustc's long form: the message, then where (` --> src/a.rs:3:5`) a few lines on — the short one
# (`--message-format=short`) is the form every tool shares
[[places]]
match = '^(?<severity>error|warning)(?:\[[^\]]*\])?: ?(?<message>.*)$'
then = '^--> (?<place>.+)$'

# No '' pair: a lifetime's quote
[language.rust]
extensions = ["rs"]
comment-token = "//"
block-comment-tokens = { start = "/*", end = "*/" }
auto-pairs = ["()", "[]", "{}", "\"\"", "``"]
doc-comments = true
roots = ["Cargo.toml"]
# rust-analyzer in a lone .rs finds no workspace ("Failed to discover workspace" at every open)
needs-project = ["Cargo.toml", "rust-project.json"]
lsp = ["rust-analyzer"]

# In debug builds (`dev`): tarae's own tests and screen snapshots are written against it
[grammar.rust]
git = "https://github.com/tree-sitter/tree-sitter-rust"
rev = "1f63b33efee17e833e0ea29266dd3d713e27e321"
bundle = true
dev = true

[test]
query = "tests.scm"
cwd = { nearest = ["Cargo.toml"] }
helpers = ["cargo"]          # {cargo-target}, {module}, {module-label}, {crate-root}
# libtest's `running 0 tests` (a filter that matched nothing) ends with 0
none-ran = [0]

run = ["cargo", "test", "{cargo-target}", "--", "{module}{path}", "--exact"]
run-group = ["cargo", "test", "{cargo-target}", "--", "{module}{groups}::"]
run-file = ["cargo", "test", "{cargo-target}", "--", "{module}"]
label = "{module}{path}"
label-group = "{module}{groups}::*"
label-file = "{module-label}"

debug = { program = "{built}", args = ["{module}{path}", "--exact", "--nocapture", "--test-threads=1"], cwd = "{cwd}", stopOnEntry = false }
debug-group = { program = "{built}", args = ["{module}{groups}::", "--nocapture", "--test-threads=1"], cwd = "{cwd}", stopOnEntry = false }
debug-file = { program = "{built}", args = ["{module}", "--nocapture", "--test-threads=1"], cwd = "{cwd}", stopOnEntry = false }

# libtest's output: a line per test, then each failure's section (`---- a::b stdout ----`) — where it
# panicked, and the rest of the section is why
[[test.line]]
match = '^test (?<name>\S+)(?: - should panic)? \.\.\. (?<status>ok|FAILED|ignored)'
status = { ok = "passed", FAILED = "failed", ignored = "skipped" }

[[test.line]]
match = '^---- (?<name>.+) stdout ----$'
begin = true

[[test.line]]
match = '^(?:failures:|test result:)'
end = true

[[test.line]]
match = '^\s*$|^note: run with'

# Before Rust 1.73: `panicked at 'message', src/a.rs:3:5`
[[test.line]]
match = '''panicked at '(?<message>.*)', (?<file>[^\s:']+\.rs):(?<line>\d+)'''

[[test.line]]
match = '''panicked at (?<file>[^\s:']+\.rs):(?<line>\d+)'''

[[test.line]]
match = '^(?<message>.*)$'

# {built}: the test binary of the file's target (its root file is {crate-root})
[test.debug-build]
run = ["cargo", "test", "--no-run", "{cargo-target}", "--message-format=json"]
env = { CARGO_TERM_COLOR = "never" }
pick = { reason = "compiler-artifact", "profile.test" = true, "target.src_path" = "{crate-root}" }
take = "executable"
error = { pick = { reason = "compiler-message", "message.level" = "error" }, text = ["message.rendered", "message.message"] }
none = "no test binary for this file"

# F5: the package's binary, built first; attach as C does (lldb-dap, the c pack)
[debug]
debugger = "lldb-dap"
launch = { program = "{built}", args = [], cwd = "{cwd}", stopOnEntry = false }
attach-pid = { pid = "{pid}", program = "{program}", cwd = "{cwd}" }
attach-remote = { attachCommands = ["gdb-remote {host}:{port}"], program = "{program}", sourceMap = [["{remote-root}", "{cwd}"]], cwd = "{cwd}" }

# A build's failure is rustc's first error, as rustc renders it
[debug.build]
when = ["Cargo.toml"]
otherwise = "open a Cargo project"
run = ["cargo", "build", "--message-format=json"]
env = { CARGO_TERM_COLOR = "never" }
pick = { reason = "compiler-artifact", "target.kind" = "bin" }
take = "executable"
error = { pick = { reason = "compiler-message", "message.level" = "error" }, text = ["message.rendered", "message.message"] }
none = "no binary target to debug"

# Where a checkout builds — cargo asked, as every cargo config of the checkout's has it (`builds.rs`). A
# build-dir with {workspace-path-hash} is one folder per checkout in the cargo home's build/xx/yyyy: a new
# session's checkout builds cold there, and an ended one's goes with it when nothing else builds there.
# Read from tarae's own packs only: it decides what's deleted.
[builds]
name = "Cargo"
when = ["Cargo.toml"]
ask = ["cargo", "metadata", "--no-deps", "--offline", "--format-version", "1"]
target = "target_directory"
build = "build_directory"
home = { env = "CARGO_HOME", else = "~/.cargo" }
setting = { env = "CARGO_BUILD_BUILD_DIR", files = [".cargo/config.toml", ".cargo/config"], home-files = ["config.toml", "config"], key = "build.build-dir", per-checkout = ["{workspace-path-hash}", "{workspace-root}"] }
remove = { under = "build", depth = 2 }
# Every project's crates and git checkouts: never removed
keep = ["registry", "git"]
# Cargo makes a new build folder under a temp name beside it, then renames it into place. Beside a checkout's
# own are other checkouts', which no run writes, so tarae makes a checkout's own before its first sandboxed
# build — marked as cargo marks one as it makes it (measured, cargo 1.99: a folder there already gets no mark):
# the cache directory tag's lines after its signature, and on macOS two attributes, byte for byte as cargo
# wrote them — kept out of Time Machine (what NSURLIsExcludedFromBackupKey writes: a binary plist of
# com.apple.backupd — header, the string, its offset, the trailer) and out of file sync (File Provider's ignore)
cache-tag = """
# This file is a cache directory tag created by cargo.
# For information about cache directory tags see https://bford.info/cachedir/
"""
macos-xattrs = [
    { name = "com.apple.metadata:com_apple_backup_excludeItem", hex = "62706c6973743030 5f1011 636f6d2e6170706c652e6261636b757064 08 0000000000000101 0000000000000001 0000000000000000 000000000000001c" },
    { name = "com.apple.fileprovider.ignore#P", hex = "31" },
]

[tasks]
when = ["Cargo.toml"]
rank = 10

[[tasks.task]]
name = "cargo check"
cmd = "cargo check --all-targets --message-format=short"

[[tasks.task]]
name = "cargo clippy"
cmd = "cargo clippy --workspace --all-targets --message-format=short"

[[tasks.task]]
name = "cargo build"
cmd = "cargo build --message-format=short"

# `:preflight` in a project with no steps of its own: formatted, clippy with warnings as errors, the tests.
# Clippy with `--workspace`: in a workspace with a root package, cargo lints only that package without it
[[preflight]]
when = ["Cargo.toml"]
rank = 10
steps = [
  { name = "fmt", cmd = "cargo fmt --all --check" },
  { name = "clippy", cmd = "cargo clippy --workspace --all-targets -- -D warnings" },
  { name = "test", cmd = "cargo test" },
]

# Another cargo holds the build directory (or the package cache): the run waits — said as its state, not
# as output, until cargo's next line; Claude's report tells the wait from the run
[[waits]]
line = '^\s*Blocking waiting for file lock on (?<what>.+)$'
for = "cargo's lock"
report = "cargo's {what} lock"

# Worktrees and checkouts inside the project aren't scanned (paths from its root; no defaults to keep)
[server.rust-analyzer]
leave-out = { init = "files.exclude", each = "{rel}" }
# One for every checkout of a repository on one toolchain (`editor.lsp-share`): rustup's toolchain files say
# which; `checkOnSave` held off while a swap's new one loads (a start with checks checks every folder); it
# reports "Fetching" when it loads its workspaces again — a toolchain file may have changed
share = { toolchain = ["rust-toolchain.toml", "rust-toolchain"], checks = "checkOnSave", reload-progress = "Fetching" }
# Its extension: says when it has nothing left to load (a swap switches then), asked for in the capabilities
quiescent = { method = "experimental/serverStatus", capability = "experimental.serverStatusNotification", field = "quiescent", health = "health", message = "message" }
# Its extension: by default `workspace/symbol` lists types only
symbol-params = { searchKind = "allSymbols", searchScope = "workspace" }
# rustc's "`#[warn(unused_variables)]` (part of …) on by default" says where a lint comes from, not what's wrong
hide-lines = ['^`#\[.*on by default$']

# rustup's proxy lands in ~/.cargo/bin; run in the project, so its rust-toolchain.toml counts. The proxy is
# on PATH even when the component isn't installed: it says so, and exits
[install.rust-analyzer]
what = "Rust's language server"
missing-says = ["is not installed for the toolchain", "Unknown binary"]
ways = [
    { run = ["rustup", "component", "add", "rust-analyzer"], bin = ["~/.cargo/bin"], project = true },
    { run = ["brew", "install", "rust-analyzer"] },
]

# A code review's grades (`risk.rs`): a change that adds or removes a line like these is high-risk — looked
# at by a person before it's brought: unsafe code, spawning, deleting and moving, permissions and links,
# sockets, the environment. Tests and benches are quiet (a high line in them still isn't)
[review]
risky = [
    '\bunsafe\b', 'Command::new', '\.exec\(', 'remove_dir_all', 'remove_file', '\bremove_dir\b', 'fs::rename',
    'set_permissions', 'symlink', 'TcpStream', 'TcpListener', 'UdpSocket', 'UnixStream',
    'UnixListener', 'libc::', 'env::set_var', 'env::remove_var', 'from_raw', 'transmute',
]
quiet = ["tests/", "benches/"]

# Claude's sandbox (`sandboxpack.rs`). What cargo and rustup read in home to work, measured
# (`target/sb/p2-measured.md`: tarae's preflight, every read in home reported): their homes. And cargo's config
# in every folder between the project and home — those files, not the folder (`credentials.toml` sits there):
# a project below a folder with one doesn't build without it ("could not load Cargo configuration")
[sandbox]
reads = ["~/.cargo", "~/.rustup", "{cargo}", "{rustup}"]
reads-above = [".cargo/config.toml", ".cargo/config"]
# Cargo's tokens: never read, wherever its home is
kept = ["{cargo}/credentials", "{cargo}/credentials.toml"]
# Where `cargo install` and rustup put programs: never written
bins = ["{cargo}/bin"]
# What of the user's environment a run gets for cargo, rustup, rustc, clippy and rustfmt (measured,
# `target/sb/lsbenv-measured.md`): cargo's config (`CARGO_*` — `CARGO_REGISTRY_TOKEN` and the like left out
# as tokens), rustup's, rustc's and the flags (`RUST*`: RUSTFLAGS, RUSTUP_TOOLCHAIN, RUST_BACKTRACE…), clippy's
# config folder. The user's own builds see the same flags, so a run doesn't rebuild what theirs built
pass = ["CARGO_*", "RUST*", "CLIPPY_CONF_DIR"]
# Where cargo fetches from by default (the index, the crates) — words on the card that asks for a host, never a
# grant
registries = ["crates.io", "*.crates.io"]
# How the sandbox names the folders `[builds]` asks cargo for (#20: the checkout's cargo config names them)
builds-said = { who = "cargo", target = "target-dir", build = "build-dir" }

[sandbox.homes]
cargo = { env = "CARGO_HOME", else = "~/.cargo" }
rustup = { env = "RUSTUP_HOME", else = "~/.rustup" }

# Cargo's shared caches — `registry/` (the index, the downloaded `.crate`s, the unpacked crates) and `git/`
# (git dependencies' databases and checkouts) — kept as they are while the network is closed: every project's
# build outside the sandbox uses what's there (cargo doesn't check an unpacked crate or a checkout again), and
# with no download a build has nothing new to put there. The files a sandboxed cargo writes there anyway, the
# network closed or open: its locks, its last-use database (SQLite, with its journal or write-ahead log), and
# the tag that tells backup tools a cache is one — written again when it's gone (measured, cargo 1.99,
# 2026-10-04). The extended attribute it sets on `registry` and `git` at every run, so file sync (iCloud,
# File Provider) leaves them alone: the one write an offline build makes there (denied, the build goes on,
# but every report would carry it)
[sandbox.caches]
home = "cargo"
dirs = ["registry", "git"]
files = [
    ".package-cache", ".package-cache-mutate", ".global-cache", ".global-cache-journal", ".global-cache-wal",
    ".global-cache-shm", "registry/CACHEDIR.TAG", "git/CACHEDIR.TAG",
]
xattr = "com.apple.fileprovider.ignore#P"
rule = "cargo's caches — its crates and git checkouts"
said = """Cargo's caches ({caches}) stay as they are while the network is closed: every project's build outside \
the sandbox uses the crates and git checkouts there. A build that needs a crate unpacked or a git dependency \
checked out fails here — that's not something to fix in the code: tell the user. A build or `cargo fetch` of \
theirs puts it there, then run it again; llm.sandbox-network opens the caches to your commands."""

# Cargo reads its config as an ancestor's and takes no copy (denied, every cargo command fails): it's left as
# it is, and the user is told once (`tokens.rs`)
[[sandbox.settings]]
tool = "cargo"
files = ["{cargo}/config.toml", "{cargo}/config"]
above = true
tell = """cargo can't work without {them}. Cargo keeps tokens in ~/.cargo/credentials.toml, which they never \
read: move it there (cargo login puts it there)."""

# What Claude runs unasked: the checks — `cargo tree` and `cargo metadata` read the dependency graph (#116),
# cargo as the checks run it, in the sandbox
[claude]
run-allow = [
    "cargo build", "cargo check", "cargo test", "cargo clippy", "cargo fmt", "cargo tree", "cargo metadata",
]
# Read unasked (#112): the toolchains' own sources and the crates cargo downloaded — never the homes themselves
code-trees = ["{cargo}/registry/src", "{rustup}/toolchains/*/lib/rustlib/src"]
# What builds and tests a project: a script calling one runs its code (`sinceyes.rs`)
builders = ["cargo", "rustc"]
# What runs that the words don't name: `cargo xtask` is the project's own `xtask/` crate (an alias in
# `.cargo/config.toml`) — the card for it again says whether that changed since its last answer
entry = [{ run = "cargo xtask", files = ["xtask/"] }]
said = { rank = 10, run = "cargo build/check/test/clippy/fmt/tree/metadata", code = "the Rust toolchain's sources ($(rustc --print sysroot)/lib/rustlib/src) or cargo's downloaded crates", tests = "Rust (cargo test)", protect = "build.rs, Cargo.toml, .cargo" }

# The sysroot `$(rustc --print sysroot)` gives where a command runs, as rustup says it (it reads the toolchain
# files; nothing of the project's runs): one of rustup's toolchains that's there (#112)
[claude.expand."$(rustc --print sysroot)"]
run = ["rustup", "show", "active-toolchain"]
env = { RUSTUP_AUTO_INSTALL = "0" }
first-word-in = "{rustup}/toolchains"
