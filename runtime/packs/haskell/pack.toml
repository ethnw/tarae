# Haskell.

# No '' pair: a name's prime (x')
[language.haskell]
extensions = ["hs"]
comment-token = "--"
block-comment-tokens = { start = "{-", end = "-}" }
auto-pairs = ["()", "[]", "{}", "\"\"", "``"]

[grammar.haskell]
git = "https://github.com/tree-sitter/tree-sitter-haskell"
rev = "0975ef72fc3c47b530309ca93937d7d143523628"
