# Zig: zls.

[language.zig]
extensions = ["zig", "zon"]
comment-token = "//"
doc-comments = true
lsp = ["zls"]

[grammar.zig]
git = "https://github.com/tree-sitter-grammars/tree-sitter-zig"
rev = "eb7d58c2dc4fbeea4745019dee8df013034ae66b"

[server.zls]

[install.zls]
what = "Zig's language server"
ways = [{ run = ["brew", "install", "zls"] }]
hint = "or your system's package, or a release from github.com/zigtools/zls"

# What builds a project: a script calling one runs its code (`sinceyes.rs`)
[claude]
builders = ["zig"]
