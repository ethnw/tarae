# TypeScript (and TSX): typescript-language-server (JavaScript's too); type-checking the project.

# What checks: the places Claude's run of it prints go to your list (]q)
checks = ["tsc"]

# tsc: `path(line,col): error TS2304: message` — the first `(line,col):`, so a path may hold parentheses
# (Next.js's `app/(auth)/page.tsx`)
[[places]]
match = '^(?<path>.+?)\((?<line>\d+),(?<col>\d+)\): ?(?<message>.*)$'

# Its files that are code: a token-like line there is code, not a token (`tokens::not_settings`)
[sandbox]
not-settings = ["ts", "tsx"]

[language.typescript]
extensions = ["ts", "mts", "cts"]
comment-token = "//"
block-comment-tokens = { start = "/*", end = "*/" }
doc-comments = true
title = "TypeScript"
roots = ["package.json", "tsconfig.json", "jsconfig.json"]
lsp = ["typescript-language-server"]
test-files = ["*.test.ts", "*.spec.ts"]

[language.tsx]
extensions = ["tsx"]
comment-token = "//"
block-comment-tokens = { start = "/*", end = "*/" }
doc-comments = true
language-id = "typescriptreact"
roots = ["package.json", "tsconfig.json", "jsconfig.json"]
lsp = ["typescript-language-server"]
test-files = ["*.test.tsx", "*.spec.tsx"]

# Two grammars in one repository
[grammar.typescript]
git = "https://github.com/tree-sitter/tree-sitter-typescript"
rev = "b1bf4825d9eaa0f3bdeb1e52f099533328acfbdf"
subpath = "typescript"

[grammar.tsx]
git = "https://github.com/tree-sitter/tree-sitter-typescript"
rev = "b1bf4825d9eaa0f3bdeb1e52f099533328acfbdf"
subpath = "tsx"

[server.typescript-language-server]
args = ["--stdio"]

[tasks]
when = ["tsconfig.json"]
rank = 30

[[tasks.task]]
name = "tsc"
cmd = "npx tsc --noEmit --pretty false"

# No `[[preflight]]` defaults: tsc usually lives in the project's node_modules/.bin, and monorepos and
# frameworks check types their own way (`tsc -b`, vue-tsc, svelte-check). `[preflight]` in .tarae.toml lists
# this project's steps.

# Also JavaScript's
[install.typescript-language-server]
what = "TypeScript and JavaScript's language server"
ways = [
    { run = ["npm", "install", "--global", "typescript-language-server", "typescript"] },
    { run = ["brew", "install", "typescript-language-server"] },
]

# A code review's grades (`risk.rs`): as JavaScript's
[review]
risky = [
    'child_process', '\beval\(', 'new Function\(', '\bfs\.(rm|rmdir|unlink|rename|chmod|symlink)', '\bfetch\(',
    'require\(.(net|http|https).\)', 'from .(node:)?(net|http|https).', 'process\.env\.\w+\s*=',
]
quiet = ["__tests__/", "*.test.ts", "*.spec.ts", "*.test.tsx", "*.spec.tsx"]
