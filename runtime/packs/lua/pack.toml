# Lua: lua-language-server.

# Its files that are code: a token-like line there is code, not a token (`tokens::not_settings`)
[sandbox]
not-settings = ["lua"]

[language.lua]
extensions = ["lua"]
comment-token = "--"
block-comment-tokens = { start = "--[[", end = "]]" }
lsp = ["lua-language-server"]

[grammar.lua]
git = "https://github.com/tree-sitter-grammars/tree-sitter-lua"
rev = "88e446476a1e97a8724dff7a23e2d709855077f2"

[server.lua-language-server]

[install.lua-language-server]
what = "Lua's language server"
ways = [{ run = ["brew", "install", "lua-language-server"] }]
hint = "or your system's package, or a release from github.com/LuaLS/lua-language-server"
