# PHP.

# Read by Composer as soon as it's on disk
config-files = { json = ["composer.json"] }

# Its files that are code: a token-like line there is code, not a token (`tokens::not_settings`)
[sandbox]
not-settings = ["php"]

[language.php]
title = "PHP"
extensions = ["php"]
comment-token = "//"
block-comment-tokens = { start = "/*", end = "*/" }
doc-comments = true

[grammar.php]
git = "https://github.com/tree-sitter/tree-sitter-php"
rev = "f860e598194f4a71747f91789bf536b393ad4a56"
