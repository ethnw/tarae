# PHP.

# Read by Composer as soon as it's on disk
config-files = { json = ["composer.json"] }

[language.php]
title = "PHP"
extensions = ["php"]
comment-token = "//"
block-comment-tokens = { start = "/*", end = "*/" }
doc-comments = true

