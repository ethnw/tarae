# The toolchain managers that serve more than one language — no grammar, no language: only what of the user's
# environment a sandboxed run gets for their shims on PATH (`sandbox::runenv`), so the core names no tool.
# mise and asdf pick a tool's version from their own variables; volta (node) and sdkman (the JVM's) find their
# homes there. A token among them (`MISE_GITHUB_TOKEN`) is left out all the same.
#
# Not direnv: a run's `sh -c` runs no prompt hook, so it has nothing to do — and `DIRENV_DIFF` is the exported
# variables themselves, encoded, where no token check can see one.

[sandbox]
pass = ["MISE_*", "ASDF_*", "VOLTA_*", "SDKMAN_*"]
# What the managers installed: an install's files, none closed by a name like a key's where a grant opened them
installs = ["~/.asdf/installs", "~/.local/share/mise/installs"]
# A connect the sandbox refused, as a program's own line says it — read as the kernel's report of it would be
# (`Policy::said_in_output`): that report is lost when the system is busy (piece D's shots, 2026-10-17: 4 and 3 of 6 never
# reported, the kernel's stream full of others' duplicate reports). Named groups: `process` (the program its line
# starts with), `host`, `port`; or a table: `line` (those groups), `when` (a line the output holds too), `process`
# (where the line doesn't say it). Only words that name the address and the port: macOS's nc (`nc -z -v`, measured
# on Darwin 27), Gradle's (the Java pack). Not a JVM's: `java.net.SocketException: Operation not permitted`
# (measured, OpenJDK 27, `Socket` and `SocketChannel`) names neither, the same for a host beyond this machine
refused-connect = [
    '^(?P<process>[\w.+-]+): connectx to (?P<host>[0-9A-Fa-f.:]+) port (?P<port>\d+) \(tcp\) failed: Operation not permitted$',
]

# What a run card of Claude's warns of (`cardwarn.rs`, cardburden 4) — the tools no one language has. Each is a
# line in the warning colour under what the card asks, said as this pack's; `asks = true`: `a` on an earlier card
# doesn't let it run unasked.
[claude]
# Programs that run what follows their words: a warning's command is found after one (`timeout 600 docker …`)
wrappers = ["timeout", "gtimeout", "env", "nice", "nohup", "time", "stdbuf", "caffeinate", "sudo", "doas"]
# Programs that end what they run after a time (GNU's `timeout`, Homebrew's `gtimeout`): a run of Claude's under
# one isn't asked whether it's stuck before its time is up (`stuck.rs`) — `-k`'s grace added
time-limits = [
    { run = "timeout", option-values = ["-k", "-s", "--kill-after", "--signal"], grace = ["-k", "--kill-after"] },
    { run = "gtimeout", option-values = ["-k", "-s", "--kill-after", "--signal"], grace = ["-k", "--kill-after"] },
]

# Docker without its own settings: `DOCKER_CONFIG` unset, it reads the user's ~/.docker (whose credential
# helpers run); `DOCKER_HOST` unset, whichever engine is current; no timeout, a hung container holds the run
[[claude.warn]]
id = "docker-own-config"
run = ["docker", "docker-compose"]
missing = [
    { env = "DOCKER_CONFIG", say = "no DOCKER_CONFIG — it reads your ~/.docker, and its credential helpers run" },
    { env = "DOCKER_HOST", say = "no DOCKER_HOST — it uses whichever engine is current" },
    { wrapper = ["timeout", "gtimeout"], say = "no timeout — a hung container holds the run" },
]
say = "Docker: {missing}."

# What a read outside the project goes to
[[claude.warn]]
id = "reads-outside"
fact = "reads-outside"
say = "What it reads outside the project goes to Claude."

# Other processes' details: a command line or an environment holds tokens at times
[[claude.warn]]
id = "process-details"
run = ["pgrep", "lsof"]
options = ["-f", "-a", "--full", "--list-full", "-p"]
option-values = ["-u", "-U", "-g", "-G", "-t", "-s", "-P", "-c", "-d"]
say = "It reads other processes' details — a command line can hold a token, and what it reads goes to Claude."
[[claude.warn]]
id = "process-env"
run = ["ps"]
options = ["-E", "e"]
# (their next word is their value: `ps -o user`)
option-values = ["-o", "-O", "-p", "-q", "-u", "-U", "-g", "-G", "-t", "-k", "-s"]
say = "It reads other processes' environments — tokens among them go to Claude."

# A script it runs changed since a card showed it, or since the last answer to this run (`sinceyes.rs`)
[[claude.warn]]
id = "script-changed"
fact = "script-changed"
say = "A script it runs changed since you last saw it — read what changed before you answer."

# Beyond this machine: never let through by `a` (D2)
[[claude.warn]]
id = "outward"
run = ["git push", "gh", "curl", "wget", "ssh", "scp", "rsync", "sftp", "nc", "ncat"]
asks = true
say = "It reaches beyond this machine — what it sends or fetches isn't on this card. Asked each time, whatever `a` said before."

# History rewritten, the working tree reset: what's lost may not come back
[[claude.warn]]
id = "history"
run = ["git rebase", "git reset", "git filter-branch", "git filter-repo", "git clean"]
say = "It rewrites git history or resets files — what it drops may not come back with space u."

# A command of Claude's can't gain privileges: no terminal to type a password in; and on Linux, under tarae's
# AppArmor profile, a command of Claude's outside the sandbox runs with no_new_privs (step 6h)
[[claude.warn]]
id = "privileges"
run = ["sudo", "su", "pkexec", "doas"]
say = "It can't gain privileges: there's no terminal for a password, and on Linux tarae's AppArmor profile runs Claude's commands outside the sandbox with no_new_privs. If it's needed, run it yourself in tarae's terminal (space T) — your own tools keep their privileges."

# An edit of Claude's to a file that runs later outside the sandbox (`sandbox::protected_names`) — the edit
# review's header
[[claude.warn]]
id = "edit-protected"
fact = "edit-protected"
say = "It changes a file that runs later outside the sandbox (a build file, a hook, settings) — read all of it."

# Secret stores (apibill D3): outside the sandbox they hand an item over unasked — `security` is the trusted app of
# the Keychain item tarae's API sessions read their key from, and the Secret Service checks no program at all.
# Sandboxed runs can't reach either (the keychain's services are denied, the session bus is a socket outside). Words
# only: a program calling them from its own code isn't seen — the card's other lines and your reading carry that.
[[claude.warn]]
id = "keychain-read"
run = ["security find-generic-password", "security find-internet-password"]
options = ["-w", "-g"]
# (their next word is their value: `-s -w` names a service called `-w`)
option-values = ["-a", "-c", "-C", "-d", "-D", "-G", "-j", "-l", "-p", "-P", "-r", "-s", "-t"]
fact = "outside-sandbox"
asks = true
say = "It reads a password from your keychain outside the sandbox — tarae's API key is there, and what it prints goes to Claude."
[[claude.warn]]
id = "keychain-dump"
run = ["security dump-keychain", "security export"]
fact = "outside-sandbox"
asks = true
say = "It dumps your keychain outside the sandbox — tarae's API key is there, and what it prints goes to Claude."
[[claude.warn]]
id = "secret-service-read"
run = ["secret-tool lookup", "secret-tool search"]
fact = "outside-sandbox"
asks = true
say = "It reads your Secret Service outside the sandbox — tarae's API key would be there, and what it prints goes to Claude."

# What writing a model's prompt cache costs, per million tokens (`switchcost.rs`): the 5-minute and the hour-long
# write — said as "≈ $X" when a switch of billing, model or effort throws a warm cache away. From
# platform.claude.com/docs/en/about-claude/pricing, read 2026-10-09 (`target/sb/apibill-src/pf-pricing.md`). A model
# not listed is said in tokens only. `model` is claude's id without a date; `up-to`: the row holds for prompts of
# at most that many tokens. `effort`: what an effort change does to its cache — `keeps` (Claude Code 2.1.260 says
# so for Fable 5.1), `rewrites`, or `unknown` (the API keeps it with per-message effort; whether Claude Code uses
