# Make: the default target.

# What runs later outside Claude's sandbox, in every project (`packs::protect`; names match in any case, so
# `makefile` too): make reads `GNUmakefile` before `Makefile`; just, a make-like runner with no pack of its
# own, reads `justfile` and `.justfile`
protect = ["Makefile", "GNUmakefile", "justfile", ".justfile"]

[tasks]
when = ["Makefile", "makefile", "GNUmakefile"]
rank = 90

[[tasks.task]]
name = "make"
cmd = "make"
