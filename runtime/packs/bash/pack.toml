# Bash and the shells that read like it (zsh, sh): bash-language-server.

[language.bash]
extensions = ["sh", "bash", "zsh"]
filenames = [".bashrc", ".bash_profile", ".zshrc", ".zprofile", ".profile", "PKGBUILD"]
comment-token = "#"
# Code fences of a shell session
aliases = ["shell", "console", "shellsession"]
language-id = "shellscript"
lsp = ["bash-language-server"]

[grammar.bash]
git = "https://github.com/tree-sitter/tree-sitter-bash"
rev = "487734f87fd87118028a65a4599352fa99c9cde8"
bundle = true

[server.bash-language-server]
args = ["start"]

[install.bash-language-server]
what = "Bash's language server"
ways = [
    { run = ["npm", "install", "--global", "bash-language-server"] },
    { run = ["brew", "install", "bash-language-server"] },
]

# A code review's grades (`risk.rs`): a change adding or removing a line like these is high-risk — deleting,
# running what it fetched, root, permissions, the network, evaluating strings, raw disks, history rewritten
[review]
risky = [
    '\brm\s+(-[a-zA-Z]*[rRf]|--recursive|--force)', '\b(curl|wget)\b[^#]*\|\s*(sudo\s+)?(ba|z|da|k)?sh\b',
    '<\(\s*(curl|wget)\b', '\b(sudo|doas)\b', '\bch(mod|own|grp)\b', '\beval\b', '\b(curl|wget|nc|ncat|ssh|scp)\b',
    '\bdd\b.*\bof=', '\bmkfs', '\bshred\b', '>\s*/dev/(sd|nvme|disk)', '\bLD_PRELOAD\b',
    '\bgit\s+(push\s.*(-f\b|--force)|reset\s+--hard|clean\s+-[a-zA-Z]*f)',
]
