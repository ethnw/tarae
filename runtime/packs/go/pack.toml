# Go: gopls; `go test` in the package's folder, dlv to debug. go.mod has a language of its own here.

# What checks and builds: the places Claude's run of one prints go to your list (]q)
checks = ["go build", "go test", "go vet", "gofmt -l"]

# gofmt indents with tabs
[language.go]
extensions = ["go"]
comment-token = "//"
block-comment-tokens = { start = "/*", end = "*/" }
indent-tabs = true
aliases = ["golang"]
roots = ["go.work", "go.mod"]
lsp = ["gopls"]
test-files = ["*_test.go"]

[language.gomod]
title = "go.mod"
filenames = ["go.mod"]
comment-token = "//"

[grammar.go]
git = "https://github.com/tree-sitter/tree-sitter-go"
rev = "64457ea6b73ef5422ed1687178d4545c3e91334a"
bundle = true

[grammar.gomod]
git = "https://github.com/camdencheek/tree-sitter-go-mod"
rev = "6efb59652d30e0e9cd5f3b3a669afd6f1a926d3c"
bundle = true

[test]
query = "tests.scm"
files = ["*_test.go"]
cwd = "file-dir"
# "no tests to run" ends with 0
none-ran = [0]
# One test ({name}); the file's tests ({names}, joined with |)
run = ["go", "test", "-v", "-run", "^{name}$", "."]
run-file = ["go", "test", "-v", "-run", "^({names})$", "."]
debug = { mode = "test", program = "{cwd}", cwd = "{cwd}", args = ["-test.run", "^{name}$", "-test.v"], outputMode = "remote" }
debug-file = { mode = "test", program = "{cwd}", cwd = "{cwd}", args = ["-test.run", "^({names})$", "-test.v"], outputMode = "remote" }

# `go test -v`: `=== RUN` starts a test (what t.Error and t.Log say comes indented, `x_test.go:8: why`
# under it), `--- PASS: TestX (0.01s)` ends it
[[test.line]]
match = '^\s*=== RUN\s+(?<name>\S+)'
begin = true

[[test.line]]
match = '^\s*--- (?<status>PASS|FAIL|SKIP): (?<name>\S+)(?: \((?<secs>[\d.]+)s\))?'
status = { PASS = "passed", FAIL = "failed", SKIP = "skipped" }

[[test.line]]
match = '^    \s*(?<file>[^\s:]+\.go):(?<line>\d+): (?<message>.*)$'

[test.kind.bench]
file = false
run = ["go", "test", "-v", "-run", "^$", "-bench", "^{name}$", "."]
debug = { mode = "test", program = "{cwd}", cwd = "{cwd}", args = ["-test.run", "^$", "-test.bench", "^{name}$", "-test.v"], outputMode = "remote" }

[test.kind.single]
file = false

[tasks]
when = ["go.mod"]
rank = 20

[[tasks.task]]
name = "go build"
cmd = "go build ./..."

[[tasks.task]]
name = "go vet"
cmd = "go vet ./..."

# `:preflight` in a project with no steps of its own: gofmt has nothing to say (it lists the files it
# would change), vet, the tests
[[preflight]]
when = ["go.mod"]
rank = 20
steps = [
  { name = "gofmt", cmd = "out=$(gofmt -l .) && [ -z \"$out\" ] || { printf '%s\\n' \"$out\"; echo 'gofmt -l: these files are not formatted'; exit 1; }" },
  { name = "go vet", cmd = "go vet ./..." },
  { name = "go test", cmd = "go test ./..." },
]

# Checkouts inside the module (with no go.mod of their own) aren't loaded (`-` = leave out, from the
# workspace folder; its default kept). gopls's settings are flat — "build" is only its docs' heading:
# `build.directoryFilters` was refused ("setting option "build": unexpected setting").
[server.gopls]
leave-out = { init = "directoryFilters", each = "-{rel}", keep = ["-**/node_modules"] }

# `go install` puts it in $GOBIN, else $GOPATH/bin, else ~/go/bin — often not on PATH
[install.gopls]
what = "Go's language server"
ways = [
    { run = ["go", "install", "golang.org/x/tools/gopls@latest"], bin = ["${GOBIN}", "${GOPATH}/bin", "~/go/bin"] },
    { run = ["brew", "install", "gopls"] },
]

# F5: the file's package. outputMode remote: the program's output comes as the debugger's output events
# (the debug pane), not on dlv's stdout
[debug]
debugger = "dlv"
launch = { mode = "debug", program = "{dir}", cwd = "{cwd}", outputMode = "remote" }
attach-pid = { mode = "local", processId = "{pid}", cwd = "{cwd}" }
# `dlv … --headless --listen :2345 --accept-multiclient` speaks DAP: straight to it
attach-tcp = { mode = "remote", substitutePath = [{ from = "{cwd}", to = "{remote-root}" }] }

# Where `go install` put it too (`[install.dlv]`'s bin)
[debugger.dlv]
adapter-id = "go"
find = ["dlv"]
run = ["{found}", "dap"]
listen = ["-l", "127.0.0.1:{port}"]
# A hint for its terminal, and its first line, building the program — its own, shown dim
quiet = ["^Type 'dlv help'"]
own-first = "^Building "

[install.dlv]
what = "Go's debugger"
ways = [
    { run = ["go", "install", "github.com/go-delve/delve/cmd/dlv@latest"], bin = ["${GOBIN}", "${GOPATH}/bin", "~/go/bin"] },
    { run = ["brew", "install", "delve"] },
]

# A code review's grades (`risk.rs`): a change adding or removing a line like these is high-risk — unsafe,
# spawning, deleting and moving, permissions and links, the network, the environment
[review]
risky = [
    '"unsafe"', '\bunsafe\.', '"os/exec"', 'exec\.Command', 'syscall\.', 'os\.RemoveAll', 'os\.Remove\(',
    'os\.Rename', 'os\.Chmod', 'os\.Symlink', 'filepath\.EvalSymlinks', 'net\.Dial', 'net\.Listen',
    'http\.(Get|Post|Head)\(', 'os\.Setenv',
]
quiet = ["*_test.go", "testdata/"]

# Claude's sandbox (`sandboxpack.rs`). What Go reads in home, measured (`target/sb/p2-measured.md`, a Go
# project): GOPATH (the module cache in it) and its settings (`os.UserConfigDir`'s `go/`) — not the user's
# build cache: runs have one of their own (below), and the user's is never read
[sandbox]
# Its files that are code: a token-like line there is code, not a token (`tokens::not_settings`)
not-settings = ["go"]
reads = ["~/go", "{user-config}/go"]
kept = ["{user-cache}/go-build"]
# Its telemetry counters: every go command (`go version` too) writes `…/go/telemetry/local/<…>.count` in its
# default `local` mode, and carries on silently when it can't. The mode is a file there (`go telemetry off`
# writes it); `GOTELEMETRY` is a read-only `go env` name, so no variable turns it off for a run — and opening
# it would let a run change the user's Go setting. Measured in P2: one denial in every Go run's report
quiet-writes = ["{user-config}/go/telemetry/"]
# A `toolchain` line in go.mod newer than the go on PATH makes go run the toolchain module of that version
# from the module cache — `go env` too (measured, `target/sb/corepack6/go-caches-toolchain.sh`: a module
# planted there was found, and refused only by the checksum database; no variable skips that check). Runs use
# the go on PATH: what runs isn't picked by a file in the checkout, and nothing is downloaded to switch. A
# project needing a newer go says so ("go.mod requires go >= …; GOTOOLCHAIN=local")
env = { GOTOOLCHAIN = "local" }
# Where `go env` says the module cache is (GOMODCACHE, GOPATH, the user's env file) — a shared cache: an
# offline build writes nothing there (measured: `go-caches-build.sh`), so it's read only while the network is
# closed — and the user's build cache, kept from runs wherever it is
ask = [{ when = ["go.mod", "go.work"], run = ["go", "env", "-json", "GOMODCACHE", "GOCACHE"], caches = ["GOMODCACHE"], kept = ["GOCACHE"] }]
# Where `go install` puts programs: never written, nor GOPATH itself
bins = ["{go}/bin", "{gobin}"]
# What of the user's environment a run gets for go (`go help environment`, by name: `GO*` would take
# GOOGLE_* too) and cgo. Not GOAUTH: the commands that fetch its credentials
pass = [
    "GO111MODULE", "GOARCH", "GOBIN", "GOCACHE", "GOCACHEPROG", "GODEBUG", "GOENV", "GOEXPERIMENT", "GOFIPS140",
    "GOFLAGS", "GOINSECURE", "GOMODCACHE", "GONOPROXY", "GONOSUMDB", "GOOS", "GOPATH", "GOPRIVATE", "GOPROXY",
    "GOROOT", "GOSUMDB", "GOTMPDIR", "GOTOOLCHAIN", "GOVCS", "GOWORK", "GOAMD64", "GOARM", "GOARM64", "GO386",
    "GOMIPS", "GOMIPS64", "GOPPC64", "GORISCV64", "GOWASM", "GOGC", "GOMAXPROCS", "GOMEMLIMIT", "GOTRACEBACK",
    "GCCGO", "CGO_*",
]
# Where go fetches modules and checks their sums by default — words on the card that asks for a host, never a
# grant
registries = ["proxy.golang.org", "sum.golang.org"]

# GOPATH may be a list (`/a:/b`): Go puts the module cache and `bin` in the first; every one is a home
[sandbox.homes]
go = { env = "GOPATH", else = "~/go", list = true }
gobin = { env = "GOBIN", else = "~/go/bin" }

# The module cache: every project's build outside the sandbox compiles what's there, and a build doesn't check
# what's unpacked there again (`go mod verify` does). Where it is by default — `$GOPATH/pkg/mod`, else where
# `GOMODCACHE` points — no grant opens it, in a Go project or not
[sandbox.caches]
asked = "GOMODCACHE"
places = ["{go}/pkg/mod"]
var = "GOMODCACHE"
rule = "Go's module cache"
said = """Go's module cache ({caches}) stays as it is while the network is closed: every project's build outside \
the sandbox uses the modules there. A build that needs a module not downloaded yet fails here — that's not \
something to fix in the code: tell the user. A build or `go mod download` of theirs puts it there, then run it \
again; llm.sandbox-network opens the cache to your commands."""

# Go's build cache, of the runs' own: kept across the project's runs (a cold one rebuilds the standard library),
# never the user's — what a run compiles there never reaches their builds
[sandbox.run-home.go-build]
env = "GOCACHE"
keep = true
when = ["go.mod", "go.work"]

# Go's env file can hold a token (`go env -w GOPROXY=https://user:…@`): denied, Go loses its settings without a
# word (`target/sb/tokens-checkpoint.md`) — a copy without it, at `GOENV` (`off`: none)
[[sandbox.settings]]
tool = "go"
var = "GOENV"
off = "off"
files = ["{user-config}/go/env"]
form = "lines"
copy = "goenv"

[claude]
run-allow = ["go build", "go test", "go vet", "gofmt -l"]
builders = ["go"]
said = { rank = 20, run = "go build/test/vet", tests = "Go" }
