# Python: basedpyright, pyright or pylsp, and ruff beside it; pytest from the project's root, with its
# virtualenv's Python; debugpy to debug.

# The virtualenv, and compiled bytecode
outputs = [".venv", "__pycache__"]
# Read by pip, uv, poetry and pipenv as soon as they're on disk
config-files = { toml = ["pyproject.toml", "Pipfile"] }

[language.python]
extensions = ["py", "pyi", "pyw"]
comment-token = "#"
indent-after-colon = true
aliases = ["python3", "py3"]
roots = ["pyproject.toml", "setup.py", "setup.cfg"]
lsp = ["basedpyright", "pyright", "pylsp"]
also = ["ruff"]
test-files = ["test_*.py", "*_test.py"]

[grammar.python]
git = "https://github.com/tree-sitter/tree-sitter-python"
rev = "4bfdd9033a2225cc95032ce77066b7aeca9e2efc"
bundle = true

[server.pylsp]

# A linter and formatter with a server of its own
[server.ruff]
args = ["server"]

[test]
query = "tests.scm"
cwd = { nearest = ["pyproject.toml", "pytest.ini", "setup.cfg", "tox.ini", "setup.py"], or = [".git"] }
helpers = ["python"]         # {python}
parse = "python"

# -v: a line per test; --tb=short: just where it failed and the E lines (what the results panel reads)
run = ["{python}", "-m", "pytest", "{rel}::{path}", "-v", "--tb=short", "--color=no"]
run-group = ["{python}", "-m", "pytest", "{rel}::{groups}", "-v", "--tb=short", "--color=no"]
run-file = ["{python}", "-m", "pytest", "{rel}", "-v", "--tb=short", "--color=no"]
label = "{rel}::{path}"
label-group = "{rel}::{groups}"
label-file = "{rel}"

debug = { module = "pytest", args = ["{rel}::{path}", "-q", "--color=no"], python = "{python}", cwd = "{cwd}", console = "internalConsole", justMyCode = false }
debug-group = { module = "pytest", args = ["{rel}::{groups}", "-q", "--color=no"], python = "{python}", cwd = "{cwd}", console = "internalConsole", justMyCode = false }
debug-file = { module = "pytest", args = ["{rel}", "-q", "--color=no"], python = "{python}", cwd = "{cwd}", console = "internalConsole", justMyCode = false }

# F5: the file, with the project's virtualenv's Python (its packages)
[debug]
debugger = "debugpy"
helpers = ["python"]
launch = { program = "{file}", python = "{python}", console = "internalConsole", cwd = "{cwd}", justMyCode = true }
attach-pid = { processId = "{pid}", justMyCode = false, cwd = "{cwd}" }
# `python -m debugpy --listen 5678 app.py` speaks DAP: straight to it
attach-tcp = { justMyCode = false, pathMappings = [{ localRoot = "{cwd}", remoteRoot = "{remote-root}" }] }

# The virtualenv's Python runs it when there is one (debugpy often lives only there); else debugpy's own
# launcher, else python3's module
[debugger.debugpy]
find = [
    { file = ["{cwd}/.venv/bin/python", "{cwd}/venv/bin/python", "${VIRTUAL_ENV}/bin/python"], run = ["{found}", "-m", "debugpy.adapter"] },
    "debugpy-adapter",
    { program = "python3", run = ["{found}", "-m", "debugpy.adapter"] },
]

[tasks]
when = ["pyproject.toml", "setup.py", "setup.cfg"]
rank = 50

[[tasks.task]]
name = "ruff"
cmd = "ruff check --output-format=concise ."
needs = "ruff"

[[tasks.task]]
name = "mypy"
cmd = "mypy --no-color-output --no-error-summary ."
needs = "mypy"

# No `[[preflight]]` defaults: Python has no single standard to guess — tests run by pytest or unittest
# (nox, tox), lint by ruff or flake8, format by ruff or black, types by mypy or pyright — and a guess that
# isn't the project's fails good code. `[preflight]` in .tarae.toml says what this project uses.

# Checkouts inside the project aren't analyzed. Asked for by section (`workspace/configuration`); giving a
# list replaces the default one, so it's kept (dot-folders are in it — `.claude/worktrees` already was; the
# four "Auto-excluding" lines pyright 1.1.414 logs).
[server.pyright]
command = "pyright-langserver"
args = ["--stdio"]
leave-out = { config = "python.analysis.exclude", each = "{rel}", keep = ["**/node_modules", "**/__pycache__", "**/.*", "**/__editable__.*"] }

[server.basedpyright]
command = "basedpyright-langserver"
args = ["--stdio"]
leave-out = { config = "basedpyright.analysis.exclude", each = "{rel}", keep = ["**/node_modules", "**/__pycache__", "**/.*", "**/__editable__.*"] }

# The first of Python's servers tarae looks for; uv and pipx put it in ~/.local/bin
[install.basedpyright-langserver]
what = "Python's language server (basedpyright)"
ways = [
    { run = ["uv", "tool", "install", "basedpyright"], bin = ["${UV_TOOL_BIN_DIR}", "${XDG_BIN_HOME}", "~/.local/bin"] },
    { run = ["pipx", "install", "basedpyright"], bin = ["${PIPX_BIN_DIR}", "~/.local/bin"] },
    { run = ["brew", "install", "basedpyright"] },
]
