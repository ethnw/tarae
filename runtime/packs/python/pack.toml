# Python: basedpyright, pyright or pylsp, and ruff beside it; pytest from the project's root, with its
# virtualenv's Python; debugpy to debug.

# The virtualenv, and compiled bytecode
outputs = [".venv", "__pycache__"]
# Read by pip, uv, poetry and pipenv as soon as they're on disk
config-files = { toml = ["pyproject.toml", "Pipfile"] }
# What checks: the places Claude's run of one prints go to your list (]q)
checks = ["ruff check", "mypy", "pytest"]

# A traceback's frames
[[places]]
match = '^File "(?<path>[^"]+)", line (?<line>\d+)'
message = "traceback"

[language.python]
extensions = ["py", "pyi", "pyw"]
comment-token = "#"
indent-after-colon = true
aliases = ["python3", "py3"]
roots = ["pyproject.toml", "setup.py", "setup.cfg"]
lsp = ["basedpyright", "pyright", "pylsp"]
also = ["ruff"]
test-files = ["test_*.py", "*_test.py"]

[grammar.python]
git = "https://github.com/tree-sitter/tree-sitter-python"
rev = "4bfdd9033a2225cc95032ce77066b7aeca9e2efc"
bundle = true

[server.pylsp]

# A linter and formatter with a server of its own
[server.ruff]
args = ["server"]

[test]
query = "tests.scm"
cwd = { nearest = ["pyproject.toml", "pytest.ini", "setup.cfg", "tox.ini", "setup.py"], or = [".git"] }
# {python}: the project's virtualenv's, else the one activated, else python3
vars = [{ name = "python", first = ["{cwd}/.venv/bin/python", "{cwd}/venv/bin/python", "${VIRTUAL_ENV}/bin/python", "python3"] }]
# pytest's 5: nothing was collected
none-ran = [0, 5]

# -v: a line per test; --tb=short: just where it failed and the E lines (what the results panel reads)
run = ["{python}", "-m", "pytest", "{rel}::{path}", "-v", "--tb=short", "--color=no"]
run-group = ["{python}", "-m", "pytest", "{rel}::{groups}", "-v", "--tb=short", "--color=no"]
run-file = ["{python}", "-m", "pytest", "{rel}", "-v", "--tb=short", "--color=no"]
label = "{rel}::{path}"
label-group = "{rel}::{groups}"
label-file = "{rel}"

debug = { module = "pytest", args = ["{rel}::{path}", "-q", "--color=no"], python = "{python}", cwd = "{cwd}", console = "internalConsole", justMyCode = false }
debug-group = { module = "pytest", args = ["{rel}::{groups}", "-q", "--color=no"], python = "{python}", cwd = "{cwd}", console = "internalConsole", justMyCode = false }
debug-file = { module = "pytest", args = ["{rel}", "-q", "--color=no"], python = "{python}", cwd = "{cwd}", console = "internalConsole", justMyCode = false }

# pytest -v: a line per test (`tests/test_x.py::TestA::test_b PASSED  [ 50%]` — the name past the file),
# then the FAILURES block: a heading per failure (`___ TestA.test_b ___`), its traceback's frames
# (`tests/test_x.py:7: in test_b` — the last before the E lines is where it failed) and its E lines
[[test.line]]
match = '^[^\s:]+::(?<name>\S+) (?<status>PASSED|FAILED|ERROR|SKIPPED|XFAIL)\b'
phase = ""
status = { PASSED = "passed", FAILED = "failed", ERROR = "failed", SKIPPED = "skipped", XFAIL = "skipped" }

[[test.line]]
match = '^=.* FAILURES '
to = "failures"

[[test.line]]
match = '^='
phase = "failures"
to = ""

# (a heading for no test — `ERROR at setup of …` — isn't one)
[[test.line]]
match = '^__[_ ]*(?<name>.*?)[_ ]*__\s*$'
phase = "failures"
begin = true
known = true
name-replace = { "." = "::" }

[[test.line]]
match = '^E\s+(?<message>.*?)\s*$'
phase = "failures"

[[test.line]]
match = '^(?<file>[^\s:]+\.py):(?<line>\d+)'
phase = "failures"
place = "last"

# F5: the file, with the project's virtualenv's Python (its packages)
[debug]
debugger = "debugpy"
vars = [{ name = "python", first = ["{cwd}/.venv/bin/python", "{cwd}/venv/bin/python", "${VIRTUAL_ENV}/bin/python", "python3"] }]
launch = { program = "{file}", python = "{python}", console = "internalConsole", cwd = "{cwd}", justMyCode = true }
attach-pid = { processId = "{pid}", justMyCode = false, cwd = "{cwd}" }
# `python -m debugpy --listen 5678 app.py` speaks DAP: straight to it
attach-tcp = { justMyCode = false, pathMappings = [{ localRoot = "{cwd}", remoteRoot = "{remote-root}" }] }

# The virtualenv's Python runs it when there is one (debugpy often lives only there); else debugpy's own
# launcher, else python3's module
[debugger.debugpy]
find = [
    { file = ["{cwd}/.venv/bin/python", "{cwd}/venv/bin/python", "${VIRTUAL_ENV}/bin/python"], run = ["{found}", "-m", "debugpy.adapter"] },
    "debugpy-adapter",
    { program = "python3", run = ["{found}", "-m", "debugpy.adapter"] },
]

[tasks]
when = ["pyproject.toml", "setup.py", "setup.cfg"]
rank = 50

[[tasks.task]]
name = "ruff"
cmd = "ruff check --output-format=concise ."
needs = "ruff"

[[tasks.task]]
name = "mypy"
cmd = "mypy --no-color-output --no-error-summary ."
needs = "mypy"

# No `[[preflight]]` defaults: Python has no single standard to guess — tests run by pytest or unittest
# (nox, tox), lint by ruff or flake8, format by ruff or black, types by mypy or pyright — and a guess that
# isn't the project's fails good code. `[preflight]` in .tarae.toml says what this project uses.

# Checkouts inside the project aren't analyzed. Asked for by section (`workspace/configuration`); giving a
# list replaces the default one, so it's kept (dot-folders are in it — `.claude/worktrees` already was; the
# four "Auto-excluding" lines pyright 1.1.414 logs).
[server.pyright]
command = "pyright-langserver"
args = ["--stdio"]
leave-out = { config = "python.analysis.exclude", each = "{rel}", keep = ["**/node_modules", "**/__pycache__", "**/.*", "**/__editable__.*"] }

[server.basedpyright]
command = "basedpyright-langserver"
args = ["--stdio"]
leave-out = { config = "basedpyright.analysis.exclude", each = "{rel}", keep = ["**/node_modules", "**/__pycache__", "**/.*", "**/__editable__.*"] }

# The first of Python's servers tarae looks for; uv and pipx put it in ~/.local/bin
[install.basedpyright-langserver]
what = "Python's language server (basedpyright)"
ways = [
    { run = ["uv", "tool", "install", "basedpyright"], bin = ["${UV_TOOL_BIN_DIR}", "${XDG_BIN_HOME}", "~/.local/bin"] },
    { run = ["pipx", "install", "basedpyright"], bin = ["${PIPX_BIN_DIR}", "~/.local/bin"] },
    { run = ["brew", "install", "basedpyright"] },
]

# A code review's grades (`risk.rs`): a change adding or removing a line like these is high-risk — spawning,
# running code, deleting and moving, permissions and links, the network, unpickling, the environment
[review]
risky = [
    '\bsubprocess\b', 'os\.system', 'os\.popen', 'os\.exec', '\beval\(', '\bexec\(', 'shutil\.rmtree',
    'os\.remove', 'os\.unlink', 'os\.rmdir', 'os\.rename', 'shutil\.move', 'os\.chmod', 'os\.symlink',
    '\bsocket\b', '\brequests\.', 'urllib', 'pickle\.load', 'os\.environ\[.*\]\s*=',
]
quiet = ["tests/", "test_*.py", "*_test.py", "conftest.py"]

# Claude's sandbox (`sandboxpack.rs`). pip's settings files (2026-10-05, `target/sb/tokens-checkpoint.md`:
# denied, pip loses its index and the rest without a word)
[sandbox]
# Its files that are code: a token-like line there is code, not a token (`tokens::not_settings`)
not-settings = ["py"]
# uv's own Pythons too (`uv python install`, and what `uv sync` fetches when the project asks for a Python not
# on the system): a venv's `python` links there, so every run of it reads it (compat B3: refused, Python died at
# its start). A toolchain's home (below): read, never written — the user's venvs run what's there
reads = [
    "~/.pip/pip.conf", "~/.config/pip/pip.conf", "~/Library/Application Support/pip/pip.conf", "{uv-python}",
]
# What of the user's environment a run gets for Python (measured: `PYTHON*`, ~50 names), its environments
# (venv, conda, pyenv) and installers (pip, uv) — an index URL with a password left out as a token
pass = ["PYTHON*", "VIRTUAL_ENV", "CONDA_*", "PYENV*", "PIP_*", "UV_*"]
# Where pip and uv fetch from by default (the index, the files) — words on the card that asks for a host, never
# a grant
registries = ["pypi.org", "files.pythonhosted.org"]
# The network closed (each host asked on a card): uv without retries (after a `n`, ~10 s of its backoff). pip
# keeps its own: once a try waited out the card's hold, the proxy refuses the run's next ones at once while the
# card waits. The network open: each as it is
env = { UV_HTTP_RETRIES = { value = "0", on = "each-host-asked" } }
# uv's cache: the user's next `uv sync` installs what's unpacked there, so nothing of a run's may reach it —
# never read nor written, wherever `UV_CACHE_DIR` puts it (runs have their own, below)
kept = ["{uv}"]

[sandbox.homes]
uv = { env = "UV_CACHE_DIR", else = "~/.cache/uv" }
uv-python = { env = "UV_PYTHON_INSTALL_DIR", else = "~/.local/share/uv/python" }

# pip's can hold a token (an `index-url` with `user:pass@`): a copy without it, the files merged as pip reads
# them — `PIP_CONFIG_FILE` when that file is there (pip then reads no user file), else `~/.pip/pip.conf`, then
# its folder's (macOS's `~/Library/Application Support/pip` when it's there, else `~/.config/pip`)
[[sandbox.settings]]
tool = "pip"
var = "PIP_CONFIG_FILE"
var-if-there = true
files = ["~/.pip/pip.conf", { first = ["{user-config}/pip", "{xdg-config}/pip"], file = "pip.conf" }]
form = "ini"
copy = "pip.conf"

# Python's bytecode, of the runs' own: Python writes a module's `.pyc` beside its source when it can — the
# interpreter's own folders too (Homebrew's are the user's), refused there and compiled again every run, each
# refusal in the report (compat B1). With a prefix every `.pyc` goes here: kept across a Python project's runs,
# never read by the user's own Python; elsewhere the run's own (any run may start Python)
[sandbox.run-home.pycache]
env = "PYTHONPYCACHEPREFIX"
keep = true
when = ["pyproject.toml", "setup.py", "setup.cfg", "requirements.txt", "Pipfile"]

# uv's cache, of the runs' own (compat B3: the user's closed, every uv command failed on it — `uv run` too):
# kept across a Python project's runs, as Go's build cache is. It starts empty: what a venv already holds runs
# offline; what isn't there yet is fetched through tarae's proxy with the network open, then kept
[sandbox.run-home.uv]
env = "UV_CACHE_DIR"
keep = true
when = ["uv.lock", "pyproject.toml", "setup.py", "setup.cfg", "requirements.txt", "Pipfile"]
said = """{home}: the user's uv cache stays as it is — their next `uv sync` installs what's there. Your commands \
have a uv cache of their own, kept for this project. A package not in it yet can't be fetched while the network \
is closed — tell the user; llm.sandbox-network lets your commands fetch it, into their own."""

[claude]
builders = ["pytest", "tox", "nox"]
said = { rank = 30, tests = "Python (pytest)" }
# What a run card warns of (`cardwarn.rs`): what changes the manifest or the lockfile, and what installs where no
# manifest records it — said before it runs, with a card or without (`start`, piece F)
warn = [
    { id = "python-manifest", run = ["uv add", "uv remove", "poetry add", "poetry remove", "pdm add", "pdm remove"], start = true, say = "It changes pyproject.toml and its lockfile (uv.lock, poetry.lock, pdm.lock)." },
    { id = "pip-install", run = ["pip install", "pip3 install", "uv pip install", "python -m pip install", "python3 -m pip install"], start = true, say = "It installs into the Python environment, and no manifest records it: requirements.txt and pyproject.toml stay as they are." },
]
