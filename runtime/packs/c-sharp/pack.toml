# C#.

# Its files that are code: a token-like line there is code, not a token (`tokens::not_settings`)
[sandbox]
not-settings = ["cs"]

[language.c-sharp]
title = "C#"
extensions = ["cs"]
comment-token = "//"
block-comment-tokens = { start = "/*", end = "*/" }
doc-comments = true
aliases = ["csharp"]
test-files = ["*Test.cs", "*Tests.cs"]

[grammar.c-sharp]
git = "https://github.com/tree-sitter/tree-sitter-c-sharp"
rev = "b5eb5742f6a7e9438bee22ce8026d6b927be2cd7"

# What builds a project: a script calling one runs its code (`sinceyes.rs`)
[claude]
builders = ["dotnet"]
