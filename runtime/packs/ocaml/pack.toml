# OCaml.

# No '' pair: a type variable ('a) and a name's prime (x')
[language.ocaml]
extensions = ["ml"]
block-comment-tokens = { start = "(*", end = "*)" }
auto-pairs = ["()", "[]", "{}", "\"\"", "``"]

[grammar.ocaml]
git = "https://github.com/tree-sitter/tree-sitter-ocaml"
rev = "9965d208337d88bbf1a38ad0b0fe49e5f5ec9677"
subpath = "ocaml"
