# JavaScript (and TypeScript) projects: every script in package.json.

[tasks]
when = ["package.json"]
rank = 40

[[tasks.task]]
name = "npm run {key}"
cmd = "npm run --silent {key}"
each = { json = "package.json", keys = "scripts" }

# `:preflight` in a project with no steps of its own: its `test` script, if it has one (a linter isn't
# standard enough to guess — `[preflight]` in .tarae.toml for that)
[[preflight]]
when = ["package.json"]
rank = 40
steps = [{ name = "npm test", cmd = "npm run --if-present test" }]
