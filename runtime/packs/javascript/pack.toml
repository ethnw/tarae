# JavaScript (and JSX): TypeScript's language server (the typescript pack's); every script in package.json.

# What runs later outside Claude's sandbox, in every project (`packs::protect`): the scripts and lifecycle
# hooks npm runs (`postinstall`…), and the dependencies a build fetches
protect = ["package.json"]
# What npm installs
outputs = ["node_modules"]
# What a first `npm install` makes beside package.json: its packages, and the lock file it writes in place (an
# empty one it takes); and a build's output folder by its usual name (tsc's `outDir`, vite's — compat B9: `tsc`
# refused making `dist/` beside package.json on Linux)
first-made = ["node_modules/", "package-lock.json", "dist/"]
# Read by npm as soon as it's on disk
config-files = { json = ["package.json"] }
# What checks and builds: the places Claude's run of one prints go to your list (]q)
checks = ["npm test", "npm run", "pnpm test", "pnpm run", "yarn test", "eslint"]

# `__tests__`: Jest's folder
[language.javascript]
extensions = ["js", "mjs", "cjs"]
comment-token = "//"
block-comment-tokens = { start = "/*", end = "*/" }
doc-comments = true
title = "JavaScript"
aliases = ["node"]
roots = ["package.json", "tsconfig.json", "jsconfig.json"]
lsp = ["typescript-language-server"]
test-files = ["*.test.js", "*.spec.js", "*.test.mjs", "*.spec.mjs", "*.test.cjs", "*.spec.cjs"]
test-dirs = ["__tests__"]

[language.jsx]
grammar = "javascript"
extensions = ["jsx"]
comment-token = "//"
block-comment-tokens = { start = "/*", end = "*/" }
doc-comments = true
language-id = "javascriptreact"
roots = ["package.json", "tsconfig.json", "jsconfig.json"]
lsp = ["typescript-language-server"]
test-files = ["*.test.jsx", "*.spec.jsx"]

[grammar.javascript]
git = "https://github.com/tree-sitter/tree-sitter-javascript"
rev = "f772967f7b7bc7c28f845be2420a38472b16a8ee"
bundle = true

[tasks]
when = ["package.json"]
rank = 40

[[tasks.task]]
name = "npm run {key}"
cmd = "npm run --silent {key}"
each = { json = "package.json", keys = "scripts" }

# No `[[preflight]]` defaults: JavaScript's toolchain doesn't define the check — npm, pnpm, yarn or bun run
# it, jest, vitest, mocha … test it, and `npm init`'s default `test` script fails on purpose. `[preflight]`
# in .tarae.toml lists this project's steps.

# A code review's grades (`risk.rs`): a change adding or removing a line like these is high-risk — spawning,
# running code, deleting and moving, permissions and links, the network, the environment
[review]
risky = [
    'child_process', '\beval\(', 'new Function\(', '\bfs\.(rm|rmdir|unlink|rename|chmod|symlink)', '\bfetch\(',
    'require\(.(net|http|https).\)', 'from .(node:)?(net|http|https).', 'process\.env\.\w+\s*=',
]
quiet = ["__tests__/", "*.test.js", "*.spec.js", "*.test.jsx", "*.spec.jsx"]

# Claude's sandbox (`sandboxpack.rs`). npm's cache, measured (`target/sb/p2-measured.md`, a Node project)
[sandbox]
# Its files that are code: a token-like line there is code, not a token (`tokens::not_settings`)
not-settings = ["js", "mjs", "jsx"]
# pnpm's metadata cache and its store, where pnpm looks (`PNPM_HOME`'s store aside; pnpm's `getCacheDir` /
# `getDataDir`): its cache `$XDG_CACHE_HOME/pnpm` on every system, else macOS's `~/Library/Caches/pnpm` or
# `~/.cache/pnpm`; its home `$XDG_DATA_HOME/pnpm`, else macOS's `~/Library/pnpm` or `~/.local/share/pnpm`. An
# offline install reads both and copies from the store; read only, as npm's — what's there runs in the user's
# projects (compat7: closed, `pnpm install --offline` failed on the metadata cache, and its `node_modules` went
# with it)
reads = [
    "~/.npm", "{npm}", "{npm-upper}", "{corepack}", "{xdg-cache}/pnpm", "{user-cache}/pnpm", "{xdg-data}/pnpm",
    "~/.local/share/pnpm", "~/Library/pnpm",
]
# Never written, nor offered on a card (`sandbox::RunsLater`), each place pnpm may look: its home holds the
# programs `pnpm add -g` installs and its store, whose files are hard-linked into the user's projects; its cache
# holds what `pnpm dlx` fetched, which runs from there later
bins = ["{xdg-cache}/pnpm", "{user-cache}/pnpm", "{xdg-data}/pnpm", "~/.local/share/pnpm", "~/Library/pnpm"]
# npm's debug log in the run's own folder, not `~/.npm/_logs` (closed): measured, every npm command was denied
# writing its log and deleting the old ones its cleanup lists — in a folder of its own the cleanup finds none
# of yours. (`logs-max=0` writes none but still tries to delete every old one.) Its "complete log" line names
# a file there while the run's folder lasts
#
# The network closed (each host asked on a card): no audit in an install — a host it doesn't need (a plain
# install passed with `n`, the audit alone went out); `npm audit` itself still asks. The network open: npm's own
#
# corepack (pnpm's and yarn's shims): a project naming no `packageManager` runs the version its home's
# `lastKnownGood.json` names; with none there it would look up the newest and write it there — its home is read
# only (below), so never: it takes its own default (compat B10)
env = { npm_config_logs_dir = "{run}", npm_config_audit = { value = "false", on = "each-host-asked" }, COREPACK_DEFAULT_TO_LATEST = "0" }
# What of the user's environment a run gets for node and its package managers (npm's settings in both cases,
# nvm, corepack, pnpm, yarn) — `npm_config__authToken`, `NODE_AUTH_TOKEN` left out as tokens. Measured: npm hands
# its whole environment on to the scripts it runs, so what isn't passed here doesn't reach them either
pass = ["npm_config_*", "NPM_CONFIG_*", "NODE_*", "NVM_*", "COREPACK_*", "PNPM_HOME", "YARN_*"]
# Where npm fetches from by default — words on the card that asks for a host, never a grant
registries = ["registry.npmjs.org"]

# Node's fetch and https ignore the proxy variables unless told (measured, `target/sb/step5-plan.md` M1: without
# it, `ENOTFOUND` — it tried to go direct; Node 26 measured). A Node too old to read it can't go out: it fails
# closed. npm itself reads the proxy variables
[sandbox.proxy]
env = { NODE_USE_ENV_PROXY = "1" }

# npm's home, wherever its cache setting moves it (npm reads `npm_config_*` in any case — both forms people
# set): what `npx` fetched runs from its `_npx/` later, outside the sandbox, so no grant or asked folder opens
# it (`sandbox::RunsLater`). Runs only read it — measured 2026-10-06 (`target/sb/corepack6/npm-ro`): `npm
# ci`, `npm ci --offline` and `npm test` from the cache, read-only, wrote nothing there and were denied nothing
# there (the network aside: the audit's lookup)
[sandbox.homes]
npm = { env = "npm_config_cache", else = "~/.npm" }
npm-upper = { env = "NPM_CONFIG_CACHE", else = "~/.npm" }
# corepack's home: the pnpm and yarn it downloaded, which run later outside the sandbox, so read only, as npm's
# (compat B10: closed, every pnpm command died in corepack before pnpm started). Unset, corepack's lookup:
# `$XDG_CACHE_HOME/node/corepack`, else `~/.cache/node/corepack` — on macOS too
corepack = { env = "COREPACK_HOME", else = "{xdg-cache}/node/corepack" }

# npm's settings hold its tokens (`_authToken`): the file is kept from every run (`allow::SECRETS`), so its
# copy without them is always given
[[sandbox.settings]]
tool = "npm"
var = "NPM_CONFIG_USERCONFIG"
var-also = ["npm_config_userconfig"]
files = ["~/.npmrc"]
form = "lines"
copy = "npmrc"

[claude]
builders = ["npm", "npx", "pnpm", "yarn"]
said = { rank = 50, protect = "package.json" }
# What a run card warns of (`cardwarn.rs`): a package published can't be taken back — asked each time (D2); what
# changes the manifest or the lockfile, said before it runs, with a card or without (`start`, piece F)
warn = [
    { id = "npm-publish", run = ["npm publish", "pnpm publish", "yarn publish", "yarn npm publish"], asks = true, say = "It publishes the package to its registry — a version published can't be taken back. Asked each time, whatever `a` said before." },
    { id = "npm-manifest", run = ["npm install", "npm i", "npm uninstall", "npm remove", "npm rm", "npm update", "pnpm add", "pnpm remove", "pnpm install", "pnpm update", "yarn add", "yarn remove", "yarn install", "yarn up"], start = true, say = "It can change package.json and its lockfile (package-lock.json, pnpm-lock.yaml, yarn.lock). package.json is protected — in the sandbox a change to it is refused." },
]
