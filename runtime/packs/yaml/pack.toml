# YAML: yaml-language-server.

# A key ending in `:` opens a block
[language.yaml]
title = "YAML"
extensions = ["yml", "yaml"]
comment-token = "#"
indent-after-colon = true
lsp = ["yaml-language-server"]

[grammar.yaml]
git = "https://github.com/ikatyang/tree-sitter-yaml"
rev = "0e36bed171768908f331ff7dff9d956bae016efb"
bundle = true

[server.yaml-language-server]
args = ["--stdio"]

[install.yaml-language-server]
what = "YAML's language server"
ways = [
    { run = ["npm", "install", "--global", "yaml-language-server"] },
    { run = ["brew", "install", "yaml-language-server"] },
]

[install.kustomize]
what = "Kustomize (renders overlays)"
ways = [{ run = ["brew", "install", "kustomize"] }]
hint = "or a release from github.com/kubernetes-sigs/kustomize"
