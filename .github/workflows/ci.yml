name: CI

# Run by hand (Actions → CI → Run workflow) — nothing starts on its own: no pushes, pull requests or schedule,
# so the shared runners see this project only when asked. The same checks run locally before a push
# (CONTRIBUTING.md).
on:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

# Every job builds with the toolchain rust-toolchain.toml pins (its components and targets too):
# `rustup toolchain install` with no name installs that one — the version is written there only.
jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install
      - run: cargo fmt --all --check

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --locked --workspace --all-targets
      - run: cargo clippy --locked --workspace --all-targets --features bundled-grammars

  # Linux's tests: x86_64, an unprivileged user, a newer git — what the maintainer's Mac isn't. macOS's tests aren't
  # CI's at all: the Mac builds and runs them at every landing (`:preflight`, `:preflight-full`)
  test:
    name: test (linux${{ matrix.features && format(', {0}', matrix.features) || '' }})
    strategy:
      fail-fast: false
      matrix:
        features: ["", bundled-grammars]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.features }}
      # Tests commit into throwaway repos (git hunks, disk sync)
      - run: |
          git config --global user.name ci
          git config --global user.email ci@example.com
      # Every failing test binary said at once (cargo stops at the first otherwise: one failure a round)
      - run: cargo test --locked --no-fail-fast --workspace --features "${{ matrix.features }}"
      # The time budgets only report here (time is judged on a fixed machine — `cargo perf` in `:preflight-full`;
      # a shared runner's numbers are its neighbours' too): they skip themselves at the test profile's opt-level 0,
      # so here in the `perf` profile (release). The build fails the job, the budgets never: their output is the
      # `perf-budgets-…` artifact, what went over the step's summary. The dev grammars (rust) for the syntax
      # budgets: only debug builds have them unasked
      - run: cargo test --locked --features dev-grammars --features "${{ matrix.features }}" --profile perf --bin tarae --no-run
      - name: perf budgets (report only)
        shell: bash
        env:
          # the 16 ms key → frame budget times this, so what's reported over is well over
          TARAE_PERF_SLACK: "3"
        run: |
          cargo test --locked --features dev-grammars --features "${{ matrix.features }}" --profile perf --bin tarae -- perf_budget > perf-budgets.txt 2>&1 && code=0 || code=$?
          {
            echo "### perf budgets, report only (exit $code)"
            echo '```'
            grep -E '^test .*FAILED$|panicked at|^test result' perf-budgets.txt || echo 'no result line: see the artifact'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          tail -n 40 perf-budgets.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: perf-budgets-linux${{ matrix.features && format('-{0}', matrix.features) || '' }}
          path: perf-budgets.txt
          if-no-files-found: ignore

  # The tests that need the network, by name (`#[ignore = "network: …"]`): a grammar downloaded and built from
  # GitHub, a new plugin built with the SDK's crates, a page fetched through tarae's proxy (which in a test dials
  # past this machine only with TARAE_MEASURE_REACHES_NETWORK). The rest of `--ignored` isn't CI's — children run in
  # a process of their own, measurements, checks by hand on a VM, the installed claude's
  # (preflight's cis_network_job_runs_every_network_test_and_only_those)
  network:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: TARAE_MEASURE_REACHES_NETWORK=1 cargo test --locked --bin tarae -- --ignored --exact grammar::tests::grammar_install_e2e plugin::cli::tests::a_new_plugin_builds web::fetch::tests::a_real_page_is_fetched
