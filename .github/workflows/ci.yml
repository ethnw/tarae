name: CI

# Run by hand (Actions → CI → Run workflow) — nothing starts on its own: no pushes, pull requests or schedule,
# so the shared runners see this project only when asked. The same checks run locally before a push
# (CONTRIBUTING.md).
on:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  # Shared runners are slower than a dev machine — the 16 ms key → frame budget gets this multiplier.
  TARAE_PERF_SLACK: "3"

# Every job builds with the toolchain rust-toolchain.toml pins (its components and targets too):
# `rustup toolchain install` with no name installs that one — the version is written there only.
jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install
      - run: cargo fmt --all --check

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --locked --all-targets
      - run: cargo clippy --locked --all-targets --features bundled-grammars

  test:
    name: test (${{ matrix.os }}${{ matrix.features && format(', {0}', matrix.features) || '' }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        features: [""]
        include:
          - os: ubuntu-latest
            features: bundled-grammars
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.features }}
      # Tests commit into throwaway repos (git hunks, disk sync)
      - run: |
          git config --global user.name ci
          git config --global user.email ci@example.com
      - run: cargo test --locked --workspace --features "${{ matrix.features }}"
      # The perf budgets skip themselves at the test profile's opt-level 0 — here in the `perf` profile
      # (release), pass or fail with TARAE_PERF_SLACK above; `cargo perf` keeps numbers, which shared runners
      # are too noisy for
      - run: cargo test --locked --features "${{ matrix.features }}" --profile perf --bin tarae -- perf_budget

  # Downloads and builds a grammar from GitHub (the #[ignore]d network test).
  network:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      # installed_claude_speaks_a_revision_we_speak is ignored too, but it runs the installed claude CLI —
      # the runner has none; it's a local check
      - run: cargo test --locked -- --ignored --skip installed_claude_speaks_a_revision_we_speak
