# Dev tasks: `cargo xtask <task>` (xtask/ — separate from the tarae binary)
[alias]
xtask = "run --quiet --package xtask --"
# The perf budgets, in an optimized build (`cargo test` builds at opt-level 0, where they skip themselves)
perf = "test --profile perf --bin tarae -- perf_budget"
# Live end-to-end runs with the real tools (tests/live.rs) — minutes, and the Claude ones use your plan
live = "test --test live -- --ignored --test-threads=1"
