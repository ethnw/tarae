# tarae's own project settings — working on tarae in tarae
[editor]
restart-build = "cargo build --release"
restart-binary = "target/release/tarae"

# A code review's grades (`risk.rs`): every change to these is high-risk — looked at by a person (space v h)
# before the review ends or a session is brought; snapshots and docs are quiet
[review]
risky = [
  "sandbox*", "landlock.rs", "seccomp.rs", "allow.rs", "trust.rs", "builds.rs", "build.rs", ".github/",
  ".tarae.toml",
]
quiet = ["src/snapshots/", "docs/"]

# A session's plans, measurements and commit drafts (target/sb/, git-ignored) go to the main checkout's
# target/sb/sessions/<name>/ when it ends — git worktree remove deletes ignored files too
[session]
keep = ["target/sb"]

[llm]
# tarae's own tests (attach.rs, dap.rs, plugin …) connect to their own port-0 listeners — opens every local port,
# the risky ones too
sandbox-localhost = true

# What CI checks (perf on a busy machine or a slower number: a pass with a note). `:preflight` — and before a
# session is brought — runs the quick set; `:preflight-full`, before publishing, every step (`full = true` too)
[preflight]
steps = [
  { name = "fmt", cmd = "cargo fmt --all --check" },
  { name = "clippy", cmd = "cargo clippy --workspace --all-targets -- -D warnings" },
  { name = "clippy bundled", cmd = "cargo clippy --workspace --all-targets --features bundled-grammars -- -D warnings", full = true },
  { name = "test", cmd = "cargo test --workspace" },
  { name = "test bundled", cmd = "cargo test --workspace --features bundled-grammars", full = true },
  { name = "perf", cmd = "cargo perf", note = "not measured|SLOWER", full = true },
]

# What a card for one of Claude's commands warns of besides the packs' (`cardwarn.rs`): `cargo xtask linux` runs
# Docker — without its own settings it reads your ~/.docker and whichever engine is current, and a hung container
# holds the run
[[cards.warn]]
id = "xtask-linux-docker"
run = ["cargo xtask linux"]
missing = [
  { env = "DOCKER_CONFIG", say = "no DOCKER_CONFIG — it reads your ~/.docker, and its credential helpers run" },
  { env = "DOCKER_HOST", say = "no DOCKER_HOST — it uses whichever engine is current" },
  { wrapper = ["timeout", "gtimeout"], say = "no timeout — a hung container holds the run" },
]
say = "cargo xtask linux runs Docker: {missing}."
