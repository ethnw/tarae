[package]
name = "tarae"
version = "0.1.0"
edition = "2024"
# The pinned toolchain's (rust-toolchain.toml) — tarae is built with exactly that one, no older
rust-version = "1.99"
license = "GPL-3.0-or-later"
repository = "https://github.com/ethnw/tarae"

[dependencies]
libc = "0.2"
anyhow = "1.0.104"
crossterm = { version = "0.29.0", features = ["use-dev-tty"] }  # poll(2)-based input — mio drops a key that arrives with a resize
libloading = "0.9.0"
memchr = "2"  # already built for regex — substring search over rope chunks
miniz_oxide = { version = "0.9", default-features = false, features = ["with-alloc"] }  # the embedded queries, unpacked once (runtime.rs)
nucleo-matcher = "0.3.1"
regex = { version = "1.13.1", default-features = false, features = ["std", "perf", "unicode-perl", "unicode-case", "unicode-gencat", "unicode-script"] }  # what tarae needs — but tree-sitter and grep-regex turn on all of `unicode` anyway (age·bool·segment: ~150 KB of tables)
ropey = "1"
serde_json = "1.0.151"
streaming-iterator = "0.1.9"
toml = "1.1.6"
toml_edit = "0.25.15"
tree-sitter = "0.27.0"
tree-sitter-language = "0.1.8"
unicode-segmentation = "1.13.3"
unicode-width = "0.2.2"
imara-diff = "0.1"
vt100 = "0.16"  # the built-in terminal: escape sequences → a screen of cells (terminal.rs)
# The project search (grep.rs): ripgrep's own crates, in-process — its walk (.gitignore, globs, threads),
# its line searcher (binary files, BOMs, context) and its matcher (smart case, words, literals)
ignore = "0.4"
grep-searcher = "0.1"
grep-regex = "0.1"
grep-matcher = "0.1"
# `read`'s pictures (media.rs): decoded, scaled and encoded in-process by memory-safe code — no external parser, no
# decoder of tarae's own. Only PNG, JPEG, GIF and WebP (and the PNG and JPEG encoders they come with); no rayon
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
# The web reader (src/web/): a page's bytes → its text, in-process by memory-safe code — only the WHATWG parser
# (html5ever, into a tree of tarae's own, web/tree.rs) and the charsets a page may name (encoding_rs, WHATWG's
# Encoding Standard); the article pick and the conversion are tarae's (the user's, 2026-10-23)
html5ever = "=0.39.0"
encoding_rs = "0.8"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
# The binary stripped, its symbols beside it: line tables (every frame's function and file:line) in
# `tarae.dSYM` on macOS, which `:restart` keeps by UUID in target/dsyms (dsyms.rs). Measured 2026-10-06:
# the binary's size the same (debug info moves LLVM's code ~1 KB, inside the last 16 KB page), the dSYM
# ~70 MB, the build ~10% longer. The dev grammars stay out (build.rs keys them on `dev-grammars`). On Linux
# `.cargo/config.toml` keeps split-debuginfo off (no `.dwp` made: strip would take the line tables it needs);
# packaging will split the symbols off with objcopy instead.
debug = "line-tables-only"
split-debuginfo = "packed"
strip = true

# Screenshots (`cargo xtask shot` builds it): release's behavior (its grammars, no debug assertions) in a
# fraction of its build time — no LTO, many codegen units, incremental, no debug info. Not for measuring speed.
[profile.shot]
inherits = "release"
opt-level = 1
lto = false
codegen-units = 256
incremental = true
debug = false
strip = false

# The docs' pictures (`cargo xtask scenes --docs` builds it, with `--features bundled-grammars`): the shot profile
# in a folder of its own (target/shot-docs), so neither build replaces the other's.
[profile.shot-docs]
inherits = "shot"

# Optimize dependencies (tree-sitter C·regex·ropey) even in debug builds — our own code keeps fast compiles.
[profile.dev.package."*"]
opt-level = 3

# Tests at opt-level 0 with line tables only: an edit → test loop rebuilds in ~2 s, not ~8.5 s (measured
# 2026-10-02: LLVM re-optimizing a big module's unit was the cost; linking 0.1 s). The perf budgets skip
# themselves there — `cargo perf` runs them in `perf` below.
[profile.test]
opt-level = 0
debug = "line-tables-only"

# The perf budgets and real-use scenarios (`cargo perf` → xtask perf): what a release build costs, so the test
# profile's opt-level doesn't change what they measure — with line tables (and not stripped, no dSYM made) so
# samples have names. Its builds turn on `dev-grammars` (xtask perf, CI), which the syntax budgets need.
# `unpacked` is macOS's (the line tables stay in the objects); Linux keeps it off (`.cargo/config.toml`).
[profile.perf]
inherits = "release"
debug = "line-tables-only"
split-debuginfo = "unpacked"
strip = false

# The compatibility suite's build (`cargo xtask compat`): optimized, as D9 times a sandboxed run against the same
# command outside it and on Linux tarae's own supervisor serves the run's socket calls — an opt-level 0 tarae would
# slow only the sandboxed side. No LTO and 16 units: `perf`'s fat LTO of the test binary was killed out of memory
# in an 11.7 GiB colima VM (compat piece 4, 2026-10-16); without it the whole-program inlining the suite's times
# don't depend on goes, not the optimizations.
[profile.compat-tests]
inherits = "release"
lto = false
codegen-units = 16
debug = "line-tables-only"
split-debuginfo = "unpacked"
strip = false


[features]
# Embed more common grammars (`bundle = true` in languages.toml — C sources in runtime/grammars.tar.gz).
# The default is only `core = true` (toml·markdown·comment — debug builds add rust); others are offered for
# download on first open.
# Where downloading isn't possible, build with:
#   cargo install --path . --features bundled-grammars
bundled-grammars = []
# Embed the `dev = true` grammars (rust) outside the debug profile, which always has them (the tests and
# screen snapshots are written against them): `cargo perf` and CI's perf budgets (the syntax budgets), and
# the trace probes' perf builds turn it on.
dev-grammars = []

[build-dependencies]
# Unpack runtime/grammars.tar.gz (flate2·tar) and compile the selected grammars (languages.toml — toml) as C (cc)
cc = "1"
flate2 = "1"
tar = "0.4"
toml = "1.1.6"

# Dev task crate (cargo xtask — .cargo/config.toml). Doesn't affect `cargo install --path .`
[workspace]
members = ["xtask"]

# `fuzzing`: what cargo-fuzz sets (`--cfg fuzzing`) when fuzz/parsers includes a reader's module — its properties
# (`check`) are built for tests and for it, never in tarae's own build
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(fuzzing)"] }

[dev-dependencies]
vt100 = "0.16.2"
wat = "1"  # wasm runtime tests are written as text
