# Go: a module with one dependency (golang.org/x/text, at a version old enough for golangci-lint's own Go to
# read), fetched outside the sandbox first.
stack = "go"
pack = "go"
tools = ["go", "gofmt", "golangci-lint"]
prewarm = ["go get golang.org/x/text@v0.14.0", "go mod tidy"]
# (GOPATH's module cache — its downloads and the dependency's tree, not every module unpacked: a tree's walk is
# 200,000 entries at most —, the user's own build cache — runs have one of their own —, golangci-lint's cache and
# Go's settings, telemetry in them)
watch = [
    "~/go/pkg/mod/cache",
    "~/go/pkg/mod/golang.org",
    "~/Library/Caches/go-build",
    "~/Library/Caches/golangci-lint",
    "~/Library/Application Support/go",
]
image = "go"

[linux]
watch = [
    "~/go/pkg/mod/cache",
    "~/go/pkg/mod/golang.org",
    "~/.cache/go-build",
    "~/.cache/golangci-lint",
    "~/.config/go",
]

[files]
"go.mod" = """
module fx

go 1.22
"""
"main.go" = """
package main

import (
	"fmt"

	"golang.org/x/text/cases"
	"golang.org/x/text/language"
)

func title(s string) string {
	return cases.Title(language.English).String(s)
}

func main() {
	fmt.Println(title("hello"))
}
"""
# (the asks lane's `new-import`: behind the `ignore` tag, so nothing else here builds it — and the prewarm's
# `go mod tidy`, which takes every other tag, doesn't fetch what it imports)
"need/need.go" = """
//go:build ignore

package need

import _ "golang.org/x/mod/semver"
"""
"main_test.go" = """
package main

import "testing"

func TestTitle(t *testing.T) {
	if got := title("hello world"); got != "Hello World" {
		t.Fatalf("title: %q", got)
	}
}
"""

[[entry]]
name = "install"
run = "go mod download"
expect = "pass"

[[entry]]
name = "build"
run = "go build ./..."
expect = "pass"
quick = true

[[entry]]
name = "test"
run = "go test ./..."
expect = "pass"
quick = true

[[entry]]
name = "vet"
run = "go vet ./..."
expect = "pass"

[[entry]]
name = "lint"
run = "golangci-lint run"
expect = "pass"

# (gofmt -l lists what isn't formatted and exits 0 either way: a listed file fails it)
[[entry]]
name = "format"
run = "test -z \"$(gofmt -l .)\""
expect = "pass"

# Go's pack protects no name of its own: a Makefile beside the module, in a folder that holds no protected name
[[entry]]
name = "makefile"
run = "printf 'all:\\n\\tgo build ./...\\n' > sub/Makefile"
expect = "refused"
said = ["Makefile"]
baseline = false
timeout = 60

# The asks lane (`cargo xtask compat --lane asks`, piece C1's measurement): everyday commands that try the
# network, run with it closed — each host asked on its card. Never in the gate.
[[entry]]
name = "get"
run = "go get golang.org/x/sync@v0.6.0"
expect = "pass"
timeout = 300
asks = true

# (go.sum emptied for the run, put back after: the module is in the cache, its sums are looked up — kept in a temp
# file: on Linux no new file is made beside the project's protected names)
[[entry]]
name = "sums"
run = "k=$(mktemp) && cp go.sum \"$k\" && : > go.sum && go mod download; s=$?; cp \"$k\" go.sum; rm -f \"$k\"; exit $s"
expect = "pass"
timeout = 300
asks = true

[[entry]]
name = "outdated"
run = "go list -m -u all"
expect = "pass"
timeout = 300
asks = true

# (an import no module in go.mod provides — need/, behind its tag — resolved as `-mod=mod` lets it)
[[entry]]
name = "new-import"
run = "GOFLAGS=-mod=mod go build -tags ignore ./need"
expect = "pass"
timeout = 300
asks = true
